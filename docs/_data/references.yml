# Single bibliography source for Digital Creativity lessons (PHASE-EX6).
#
# One canonical Chicago author-date entry per work, keyed `surname-year`.
# Lessons list keys in front matter (`references: [...]`) and render with
# `_includes/references.html`. In-text links are `#ref-<key>`.
# Only page- or section-verified works belong here; unresolved works stay in
# research-manifest.yml (gap). No internal store names, ids, or paths.

aldahoul-2025:
  sort: "AlDahoul Rahwan Zaki 2025"
  year: 2025
  edition_used: "Scientific Reports open-access PDF (printed article pages)."
  chicago: >-
