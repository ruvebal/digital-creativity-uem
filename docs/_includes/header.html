<header
	id="site-header"
	class="site-chrome-header bg-white dark:bg-neutral-950 border-b border-slate-200 dark:border-neutral-800 sticky top-0 z-40 backdrop-blur-sm bg-opacity-95 dark:bg-opacity-95 shadow-sm dark:shadow-neutral-900/50">
	<nav class="mx-auto px-4 py-4" aria-label="Main navigation">
		<div class="flex items-center justify-between">
			<a
				href="{{ site.baseurl }}/"
				class="brand flex items-center gap-2 font-bold text-xl text-slate-900 dark:text-neutral-100 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
				<img src="{{ '/assets/icons/favicon.svg' | relative_url }}" alt="" class="brand-logo w-8 h-8" aria-hidden="true" />
				<span>Creación Digital</span>
			</a>
			<ul class="flex gap-6 text-sm">
				<li>
					{% if page.lang == 'es' %}
					<a
						href="{{ site.baseurl }}/tracks/es/"
						class="text-slate-600 dark:text-neutral-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
						Cursos
					</a>
					{% else %}
					<a
						href="{{ site.baseurl }}/tracks/en/"
						class="text-slate-600 dark:text-neutral-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
						Tracks
					</a>
					{% endif %}
				</li>
				<li>
					{% if page.lang == 'es' %}
					<a
						href="{{ site.baseurl }}/methodology/es/"
						class="text-slate-600 dark:text-neutral-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
						Metodología
					</a>
					{% else %}
					<a
						href="{{ site.baseurl }}/methodology/en/"
						class="text-slate-600 dark:text-neutral-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
						Methodology
					</a>
					{% endif %}
				</li>
				<li>
					<a
						href="{{ site.baseurl }}/tao/"
						class="text-slate-600 dark:text-neutral-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
						Tao
					</a>
				</li>
				<li>
					<a
						href="{{ site.baseurl }}/directory/en/"
						class="text-slate-600 dark:text-neutral-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
						Directory
					</a>
				</li>
				<li>
					<a
						href="{{ site.baseurl }}/lexicum/"
						class="text-slate-600 dark:text-neutral-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
						Lexicum
					</a>
				</li>
				<li>
					<a
						href="{{ site.baseurl }}/evaluation/"
						class="text-slate-600 dark:text-neutral-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
						Evaluation
					</a>
				</li>
				<li>
					<a
						href="{{ site.baseurl }}/assignments/en/digital-creativity-portfolio/"
						class="text-slate-600 dark:text-neutral-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
						Portfolio brief
					</a>
				</li>
				<li>
					<a
						href="{{ site.baseurl }}/ai-declaration/"
						class="text-slate-600 dark:text-neutral-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
						AI declaration
					</a>
				</li>
			</ul>
		</div>
	</nav>
</header>
