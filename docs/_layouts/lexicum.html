<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}" id="html-root" class="dark" style="color-scheme: dark;">
	<head>
		{% include head.html %}
		<link rel="stylesheet" href="{{ '/assets/css/lexicum.css' | relative_url }}" />
	</head>
	<body class="bg-white dark:bg-neutral-950 text-slate-900 dark:text-neutral-100 antialiased">
		<a href="#main" class="skip-link">
			{% if page.lang == 'es' %}Saltar al contenido{% else %}Skip to main content{% endif %}
		</a>
		{% include header.html %}
		<main id="main" class="lexicum-page min-h-screen w-full max-w-none">
			{{ content }}
		</main>
		{% include footer.html %}
		<script src="{{ '/assets/js/lexicum.js' | relative_url }}" defer></script>
	</body>
</html>
