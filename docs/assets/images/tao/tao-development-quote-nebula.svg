<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Transparent nebula shader quote background</title>
  <desc id="desc">Low-contrast transparent shader field for Tao of Development quotes, with no embedded text.</desc>
  <defs>
    <radialGradient id="warm-field" cx="18%" cy="18%" r="72%">
      <stop offset="0" stop-color="#E2B127" stop-opacity=".22"/>
      <stop offset=".46" stop-color="#0EA5A3" stop-opacity=".10"/>
      <stop offset="1" stop-color="#0EA5A3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool-field" cx="88%" cy="74%" r="82%">
      <stop offset="0" stop-color="#9373DD" stop-opacity=".16"/>
      <stop offset=".52" stop-color="#C44536" stop-opacity=".08"/>
      <stop offset="1" stop-color="#9373DD" stop-opacity="0"/>
    </radialGradient>
    <filter id="nebula" x="-12%" y="-18%" width="124%" height="136%">
      <feTurbulence type="fractalNoise" baseFrequency=".011 .032" numOctaves="4" seed="29" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        .42 0 0 0 .10
        0 .38 0 0 .12
        0 0 .58 0 .20
        0 0 0 .42 0" result="colour"/>
      <feGaussianBlur in="colour" stdDeviation="14"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="41" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .08"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="420" fill="url(#warm-field)"/>
  <rect width="1600" height="420" fill="url(#cool-field)"/>
  <rect x="-120" y="-80" width="1840" height="580" filter="url(#nebula)" opacity=".42"/>
  <rect width="1600" height="420" filter="url(#grain)" opacity=".55"/>
</svg>
