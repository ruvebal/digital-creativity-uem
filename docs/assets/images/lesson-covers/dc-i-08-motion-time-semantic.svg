  <g fill="none"><path d="M220 310 C350 170 350 90 480 230" fill="none" stroke="#9BE2D1" stroke-width="4" stroke-opacity=".55"/><path d="M480 230 C640 230 640 230 800 230" fill="none" stroke="#9BE2D1" stroke-width="4" stroke-opacity=".55"/><path d="M800 230 C960 230 960 230 1120 230" fill="none" stroke="#9BE2D1" stroke-width="4" stroke-opacity=".55"/><path d="M1120 230 C960 370 960 560 800 420" fill="none" stroke="#9BE2D1" stroke-width="4" stroke-opacity=".55"/><path d="M800 420 C510 560 510 450 220 310" fill="none" stroke="#9BE2D1" stroke-width="4" stroke-opacity=".55"/></g>
