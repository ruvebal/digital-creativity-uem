<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title-i-2-dibujo-2d-semantic desc-i-2-dibujo-2d-semantic">
  <title id="title-i-2-dibujo-2d-semantic">Drawing as externalised thought</title>
  <desc id="desc-i-2-dibujo-2d-semantic">Semantic graph linking intention, mark, curve construction, critique, and revision in digital drawing.</desc>
  <defs>
    <linearGradient id="semantic-ground-i-2-dibujo-2d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18141D"/>
      <stop offset="1" stop-color="#070A11"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="620" rx="34" fill="url(#semantic-ground-i-2-dibujo-2d)"/>
  <g fill="none"><path d="M280 300 C450 160 450 80 620 220" fill="none" stroke="#9BE2D1" stroke-width="4" stroke-opacity=".55"/><path d="M620 220 C800 220 800 220 980 220" fill="none" stroke="#9BE2D1" stroke-width="4" stroke-opacity=".55"/><path d="M980 220 C800 360 800 560 620 420" fill="none" stroke="#9BE2D1" stroke-width="4" stroke-opacity=".55"/><path d="M620 420 C800 420 800 420 980 420" fill="none" stroke="#9BE2D1" stroke-width="4" stroke-opacity=".55"/><path d="M980 420 C630 280 630 160 280 300" fill="none" stroke="#9BE2D1" stroke-width="4" stroke-opacity=".55"/></g>
  <g font-family="Inter,Arial,sans-serif"><g transform="translate(280 300)">
    <circle r="118" fill="#E8C56C" fill-opacity=".2" stroke="#E8C56C" stroke-width="4"/>
    <text y="-16" text-anchor="middle" fill="#FFF7EC" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">INTENT</text>
    <text y="22" text-anchor="middle" fill="#FFF7EC" font-family="Inter,Arial,sans-serif" font-size="19">what must be seen?</text>
  </g><g transform="translate(620 220)">
    <circle r="110" fill="#F07C63" fill-opacity=".2" stroke="#F07C63" stroke-width="4"/>
    <text y="-16" text-anchor="middle" fill="#FFF7EC" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">MARK</text>
    <text y="22" text-anchor="middle" fill="#FFF7EC" font-family="Inter,Arial,sans-serif" font-size="19">line as thought</text>
  </g><g transform="translate(980 220)">
    <circle r="118" fill="#9BE2D1" fill-opacity=".2" stroke="#9BE2D1" stroke-width="4"/>
    <text y="-16" text-anchor="middle" fill="#FFF7EC" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">CURVE</text>
    <text y="22" text-anchor="middle" fill="#FFF7EC" font-family="Inter,Arial,sans-serif" font-size="19">anchors · handles</text>
  </g><g transform="translate(620 420)">
    <circle r="110" fill="#F07C63" fill-opacity=".2" stroke="#F07C63" stroke-width="4"/>
    <text y="-16" text-anchor="middle" fill="#FFF7EC" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">CRITIQUE</text>
    <text y="22" text-anchor="middle" fill="#FFF7EC" font-family="Inter,Arial,sans-serif" font-size="19">what fails?</text>
  </g><g transform="translate(980 420)">
    <circle r="118" fill="#E8C56C" fill-opacity=".2" stroke="#E8C56C" stroke-width="4"/>
    <text y="-16" text-anchor="middle" fill="#FFF7EC" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">REVISE</text>
    <text y="22" text-anchor="middle" fill="#FFF7EC" font-family="Inter,Arial,sans-serif" font-size="19">rebuild the path</text>
  </g>
    <text x="800" y="575" text-anchor="middle" fill="#E8C56C" font-size="24">anchors and curves hold decisions the hand made visible</text>
  </g>
