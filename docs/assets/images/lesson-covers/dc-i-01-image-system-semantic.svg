    <text y="22" text-anchor="middle" fill="#FFF7EC" font-family="Inter,Arial,sans-serif" font-size="19">who makes it?</text>
  </g><g transform="translate(760 310)">
    <circle r="142" fill="#F07C63" fill-opacity=".2" stroke="#F07C63" stroke-width="4"/>
