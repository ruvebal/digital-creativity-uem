  <g fill="none"><path d="M330 310 C545 170 545 170 760 310" fill="none" stroke="#9BE2D1" stroke-width="4" stroke-opacity=".55"/><path d="M760 310 C1015 170 1015 90 1270 230" fill="none" stroke="#9BE2D1" stroke-width="4" stroke-opacity=".55"/><path d="M760 310 C1015 450 1015 530 1270 390" fill="none" stroke="#9BE2D1" stroke-width="4" stroke-opacity=".55"/><path d="M330 310 C545 450 545 450 760 310" fill="none" stroke="#9BE2D1" stroke-width="4" stroke-opacity=".55"/></g>
