  <title id="title-i-1-imagenes-digitales-semantic">Digital fashion image regimes</title>
  <desc id="desc-i-1-imagenes-digitales-semantic">Semantic graph connecting practice, venue, audience, circulation, and the changing boundary between art and commerce.</desc>
