<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title-i-4-stack desc-i-4-stack">
  <title id="title-i-4-stack">Reversible effect layer stack placeholder</title>
  <desc id="desc-i-4-stack">A left-to-right workflow shows source, mask, adjustment, composite, verification, and export as separate editable stages, with a loop back from review to adjustment.</desc>
  <defs>
    <linearGradient id="ground-i-4-stack" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18141D"/><stop offset="1" stop-color="#070A11"/></linearGradient>
    <pattern id="grid-i-4-stack" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFF7EC" stroke-opacity=".06" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="560" rx="30" fill="url(#ground-i-4-stack)"/>
  <g font-family="Inter,Arial,sans-serif" fill="#FFF7EC">
    <text x="76" y="70" font-size="18" font-weight="700" letter-spacing="3" fill="#E8C56C">LAYER-STACK PLACEHOLDER</text>
    <text x="76" y="110" font-size="28" font-weight="600">Keep each decision inspectable and reversible</text>
    <g stroke="#9BE2D1" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M282 292h38m-12-12 12 12-12 12M524 292h38m-12-12 12 12-12 12M766 292h38m-12-12 12 12-12 12M1008 292h38m-12-12 12 12-12 12M1250 292h38m-12-12 12 12-12 12"/>
    </g>
    <g transform="translate(72 162)">
      <rect width="210" height="250" rx="18" fill="#10131C" stroke="#E8C56C" stroke-width="2"/>
      <rect x="18" y="20" width="174" height="130" rx="10" fill="url(#grid-i-4-stack)" stroke="#FFF7EC" stroke-opacity=".2" stroke-dasharray="7 7"/>
      <path d="M76 124V83c0-12 9-21 21-21s21 9 21 21v41m-42-25h42" fill="none" stroke="#E8C56C" stroke-width="7" stroke-linecap="round"/>
      <text x="18" y="190" font-size="15" font-weight="700" letter-spacing="1.5" fill="#E8C56C">01 SOURCE</text><text x="18" y="216" font-size="14" opacity=".68">original retained</text>
    </g>
    <g transform="translate(314 162)">
      <rect width="210" height="250" rx="18" fill="#10131C" stroke="#F07C63" stroke-width="2"/>
      <rect x="18" y="20" width="174" height="130" rx="10" fill="#151923" stroke="#FFF7EC" stroke-opacity=".2" stroke-dasharray="7 7"/>
      <path d="M67 116c-22-27-2-54 38-65 40 11 60 38 38 65-18 22-58 22-76 0Z" fill="#F07C63" fill-opacity=".25" stroke="#F07C63" stroke-width="3" stroke-dasharray="6 5"/>
      <text x="18" y="190" font-size="15" font-weight="700" letter-spacing="1.5" fill="#F07C63">02 MASK</text><text x="18" y="216" font-size="14" opacity=".68">selection stays editable</text>
    </g>
    <g transform="translate(556 162)">
      <rect width="210" height="250" rx="18" fill="#10131C" stroke="#9BE2D1" stroke-width="2"/>
      <rect x="18" y="20" width="174" height="130" rx="10" fill="#151923" stroke="#FFF7EC" stroke-opacity=".2" stroke-dasharray="7 7"/>
      <path d="M52 62h106M52 84h82M52 106h94M52 128h69" stroke="#9BE2D1" stroke-width="7" stroke-linecap="round" opacity=".75"/><circle cx="159" cy="62" r="7" fill="#E8C56C"/>
      <text x="18" y="190" font-size="15" font-weight="700" letter-spacing="1.2" fill="#9BE2D1">03 ADJUSTMENT</text><text x="18" y="216" font-size="14" opacity=".68">effect on a separate layer</text>
    </g>
    <g transform="translate(798 162)">
      <rect width="210" height="250" rx="18" fill="#10131C" stroke="#9BE2D1" stroke-width="2"/>
      <rect x="18" y="20" width="174" height="130" rx="10" fill="url(#grid-i-4-stack)" stroke="#FFF7EC" stroke-opacity=".2" stroke-dasharray="7 7"/>
      <circle cx="105" cy="84" r="36" fill="#9BE2D1" fill-opacity=".15" stroke="#9BE2D1" stroke-width="2"/><path d="M80 100 99 77l13 13 14-23 17 33" fill="none" stroke="#E8C56C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="190" font-size="15" font-weight="700" letter-spacing="1.5" fill="#9BE2D1">04 COMPOSITE</text><text x="18" y="216" font-size="14" opacity=".68">layers combine visibly</text>
    </g>
    <g transform="translate(1040 162)">
      <rect width="210" height="250" rx="18" fill="#10131C" stroke="#E8C56C" stroke-width="2"/>
      <rect x="18" y="20" width="174" height="130" rx="10" fill="#151923" stroke="#FFF7EC" stroke-opacity=".2" stroke-dasharray="7 7"/>
      <circle cx="105" cy="84" r="34" fill="none" stroke="#E8C56C" stroke-width="4"/><path d="m86 84 13 13 26-29" fill="none" stroke="#9BE2D1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="190" font-size="15" font-weight="700" letter-spacing="1.5" fill="#E8C56C">05 VERIFY</text><text x="18" y="216" font-size="14" opacity=".68">check intent and evidence</text>
    </g>
    <g transform="translate(1282 162)">
      <rect width="210" height="250" rx="18" fill="#10131C" stroke="#F07C63" stroke-width="2"/>
      <rect x="18" y="20" width="174" height="130" rx="10" fill="#151923" stroke="#FFF7EC" stroke-opacity=".2" stroke-dasharray="7 7"/>
      <path d="M79 53h41l22 22v45H79Z" fill="none" stroke="#F07C63" stroke-width="4" stroke-linejoin="round"/><path d="M120 53v23h22M91 91h39M91 104h30" stroke="#F07C63" stroke-width="3" stroke-linecap="round"/>
      <text x="18" y="190" font-size="15" font-weight="700" letter-spacing="1.5" fill="#F07C63">06 EXPORT</text><text x="18" y="216" font-size="14" opacity=".68">record settings + disclosure</text>
    </g>
    <path d="M1144 437v38H660v-34" fill="none" stroke="#E8C56C" stroke-opacity=".62" stroke-width="2.5" stroke-dasharray="7 7" stroke-linecap="round" stroke-linejoin="round"/><path d="m650 450 10-10 10 10" fill="none" stroke="#E8C56C" stroke-opacity=".8" stroke-width="2.5"/>
    <text x="900" y="510" text-anchor="middle" font-size="16" fill="#E8C56C">Review loop: if the result fails the brief, return to the adjustment.</text>
  </g>
</svg>
