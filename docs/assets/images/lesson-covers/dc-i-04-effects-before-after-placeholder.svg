<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title-i-4-compare desc-i-4-compare">
  <title id="title-i-4-compare">Purposeful effect and over-effected comparison placeholders</title>
  <desc id="desc-i-4-compare">Three blank comparison cards represent a source, a restrained expressive effect, and an overloaded treatment, with prompts for legibility and intent.</desc>
  <defs>
    <linearGradient id="ground-i-4-compare" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18141D"/><stop offset="1" stop-color="#070A11"/></linearGradient>
    <pattern id="grid-i-4-compare" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFF7EC" stroke-opacity=".06" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="560" rx="30" fill="url(#ground-i-4-compare)"/>
  <g font-family="Inter,Arial,sans-serif" fill="#FFF7EC">
    <text x="76" y="70" font-size="18" font-weight="700" letter-spacing="3" fill="#E8C56C">COMPARISON PLACEHOLDER</text>
    <text x="76" y="110" font-size="28" font-weight="600">What stays legible after the effect?</text>
    <g transform="translate(92 148)">
      <rect width="420" height="300" rx="20" fill="#10131C" stroke="#E8C56C" stroke-width="2"/>
      <rect x="16" y="16" width="388" height="218" rx="12" fill="url(#grid-i-4-compare)" stroke="#FFF7EC" stroke-opacity=".2" stroke-dasharray="8 8"/>
      <path d="M142 178v-64c0-18 14-32 32-32s32 14 32 32v64m-64-38h64" fill="none" stroke="#E8C56C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".78"/>
      <text x="32" y="270" font-size="16" font-weight="700" letter-spacing="2" fill="#E8C56C">SOURCE</text>
      <text x="32" y="290" font-size="14" opacity=".68">baseline / recoverable</text>
    </g>
    <path d="M540 296h46m-15-15 15 15-15 15" fill="none" stroke="#9BE2D1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(590 148)">
      <rect width="420" height="300" rx="20" fill="#10131C" stroke="#9BE2D1" stroke-width="2"/>
      <rect x="16" y="16" width="388" height="218" rx="12" fill="url(#grid-i-4-compare)" stroke="#FFF7EC" stroke-opacity=".2" stroke-dasharray="8 8"/>
      <circle cx="210" cy="126" r="70" fill="#9BE2D1" fill-opacity=".12" stroke="#9BE2D1" stroke-width="3"/>
      <path d="M170 166v-49c0-15 12-27 27-27s27 12 27 27v49m-54-29h54" fill="none" stroke="#E8C56C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M137 198h146" stroke="#9BE2D1" stroke-width="3" stroke-opacity=".6" stroke-dasharray="3 8"/>
      <text x="32" y="270" font-size="16" font-weight="700" letter-spacing="2" fill="#9BE2D1">PURPOSEFUL</text>
      <text x="32" y="290" font-size="14" opacity=".68">intent visible / form readable</text>
    </g>
    <path d="M1038 296h46m-15-15 15 15-15 15" fill="none" stroke="#F07C63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(1088 148)">
      <rect width="420" height="300" rx="20" fill="#10131C" stroke="#F07C63" stroke-width="2"/>
      <rect x="16" y="16" width="388" height="218" rx="12" fill="url(#grid-i-4-compare)" stroke="#FFF7EC" stroke-opacity=".2" stroke-dasharray="8 8"/>
      <circle cx="210" cy="126" r="78" fill="#F07C63" fill-opacity=".2" stroke="#F07C63" stroke-width="3"/>
      <circle cx="210" cy="126" r="58" fill="none" stroke="#E8C56C" stroke-width="5" stroke-dasharray="9 5"/>
      <circle cx="210" cy="126" r="38" fill="none" stroke="#9BE2D1" stroke-width="5" stroke-dasharray="2 7"/>
      <path d="M156 171 264 81M157 82l106 90" stroke="#F07C63" stroke-width="5" stroke-linecap="round" opacity=".8"/>
      <text x="32" y="270" font-size="16" font-weight="700" letter-spacing="2" fill="#F07C63">OVER-EFFECTED</text>
      <text x="32" y="290" font-size="14" opacity=".68">decoration competes / meaning obscured</text>
    </g>
    <text x="800" y="506" text-anchor="middle" font-size="17" fill="#FFF7EC" opacity=".76">Compare purpose, restraint, and the information each treatment preserves.</text>
  </g>
</svg>
