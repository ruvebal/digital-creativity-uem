<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="t d"><title id="t">Evidence ladder for a movement that travels</title><desc id="d">Course diagram, a ladder of four rungs from weakest to strongest evidence. Rung 1, visual analogy: it looks like; needs only eyes; never enough on its own. Rung 2, quotation: a title, credit or statement names the source. Rung 3, exchange: a dated record shows people worked together. Rung 4, documented influence: testimony, dates and works line up. Two examples: Kazuo Ohno's 1977 solo is titled after the Spanish dancer La Argentina, whom he saw dance decades earlier, sources give 1926, 1927 or 1929. Issey Miyake's pleated costumes for William Forsythe's Frankfurt Ballet, 1991 or 1992, are described as the prototype of Pleats Please, launched 1993. A side panel says appropriation is a question of power, not a rung: who is credited, paid or displaced.</desc><rect width="760" height="470" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="24" y="36" fill="#111111" font-size="20" text-anchor="start" font-weight="700">How do we know a movement travelled?</text><text x="24" y="58" fill="#6B645C" font-size="12" text-anchor="start" font-weight="400" font-style="italic">Climb only as high as your evidence</text><path stroke="#111111" stroke-width="3" d="M40 446 V90 M64 446 V90"/><path stroke="#111111" stroke-width="3" d="M40 418 H64"/><rect x="80" y="394" width="372" height="54" rx="6" fill="#FFFCF7" stroke="#111111" stroke-width="1.25"/><text x="94" y="415" fill="#B4442C" font-size="13" text-anchor="start" font-weight="700">1 · VISUAL ANALOGY</text><text x="94" y="436" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">“It looks like…” — needs only eyes. Never enough alone.</text><path stroke="#111111" stroke-width="3" d="M40 332 H64"/><rect x="80" y="308" width="372" height="54" rx="6" fill="#FFFCF7" stroke="#111111" stroke-width="1.25"/><text x="94" y="329" fill="#111111" font-size="13" text-anchor="start" font-weight="700">2 · QUOTATION</text><text x="94" y="350" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">A title, credit or statement names the source.</text><path stroke="#111111" stroke-width="3" d="M40 246 H64"/><rect x="80" y="222" width="372" height="54" rx="6" fill="#FFFCF7" stroke="#111111" stroke-width="1.25"/><text x="94" y="243" fill="#111111" font-size="13" text-anchor="start" font-weight="700">3 · EXCHANGE</text><text x="94" y="264" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">A dated record shows people worked together.</text><path stroke="#111111" stroke-width="3" d="M40 160 H64"/><rect x="80" y="136" width="372" height="54" rx="6" fill="#FFFCF7" stroke="#111111" stroke-width="1.25"/><text x="94" y="157" fill="#2C5F8A" font-size="13" text-anchor="start" font-weight="700">4 · DOCUMENTED INFLUENCE</text><text x="94" y="178" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">Testimony + dates + works line up.</text><rect x="468" y="84" width="272" height="232" rx="6" fill="#EFE6D6"/><text x="482" y="108" fill="#111111" font-size="12" text-anchor="start" font-weight="700">Kazuo Ohno,</text><text x="482" y="125" fill="#111111" font-size="12" text-anchor="start" font-weight="700" font-style="italic">Admiring La Argentina (1977)</text><text x="482" y="144" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">Title names Antonia Mercé (rung 2).</text><text x="482" y="160" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">When did he see her dance?</text><text x="482" y="176" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">1926? 1927? 1929? Sources disagree.</text><text x="482" y="220" fill="#111111" font-size="12" text-anchor="start" font-weight="700">Forsythe × Miyake</text><text x="482" y="237" fill="#111111" font-size="12" text-anchor="start" font-weight="700" font-style="italic">Frankfurt Ballet, 1991 or 1992</text><text x="482" y="256" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">Pleated costumes for dancers</text><text x="482" y="272" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">→ Pleats Please, 1993 (rung 3).</text><rect x="468" y="330" width="272" height="116" rx="6" fill="#FFFCF7" stroke="#B4442C" stroke-width="2"/><text x="484" y="354" fill="#B4442C" font-size="13" text-anchor="start" font-weight="700">APPROPRIATION</text><text x="484" y="374" fill="#111111" font-size="12" text-anchor="start" font-weight="400">is not a rung. It is a question</text><text x="484" y="391" fill="#111111" font-size="12" text-anchor="start" font-weight="400">of power: who is credited,</text><text x="484" y="408" fill="#111111" font-size="12" text-anchor="start" font-weight="400">paid, displaced?</text></g></svg>
