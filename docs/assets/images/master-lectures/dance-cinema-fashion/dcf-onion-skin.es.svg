<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="t d"><title id="t">De la ráfaga a una imagen del tiempo</title><desc id="d">Diagrama del curso del método del Lab. Paso 1, dispara una ráfaga de un giro con el móvil, unas doce fotos. Paso 2, elige seis. Paso 3, apílalas como capas de Photoshop al veinticinco por ciento de opacidad, o con el modo de fusión Aclarar. Paso 4, una sola imagen muestra cómo viajó la prenda en el tiempo, como una cronofotografía.</desc><rect width="760" height="250" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="24" y="36" fill="#111111" font-size="20" text-anchor="start" font-weight="700">Ráfaga → capas → una imagen del tiempo</text><rect x="30" y="62" width="32" height="44" fill="#FFFCF7" stroke="#6B645C"/><g opacity="1"><circle cx="46.0" cy="71.1" r="6.1" fill="#111111"/><path fill="#B4442C" d="M43.0 77.2 h6.1 l6.8 22.0 h-19.8 z"/></g><rect x="66" y="62" width="32" height="44" fill="#FFFCF7" stroke="#6B645C"/><g opacity="1"><circle cx="82.0" cy="71.1" r="6.1" fill="#111111"/><path fill="#B4442C" d="M79.0 77.2 h6.1 l7.6 22.0 h-21.3 z"/></g><rect x="102" y="62" width="32" height="44" fill="#FFFCF7" stroke="#6B645C"/><g opacity="1"><circle cx="118.0" cy="71.1" r="6.1" fill="#111111"/><path fill="#B4442C" d="M115.0 77.2 h6.1 l8.4 22.0 h-22.8 z"/></g><rect x="138" y="62" width="32" height="44" fill="#FFFCF7" stroke="#6B645C"/><g opacity="1"><circle cx="154.0" cy="71.1" r="6.1" fill="#111111"/><path fill="#B4442C" d="M151.0 77.2 h6.1 l9.1 22.0 h-24.3 z"/></g><rect x="30" y="110" width="32" height="44" fill="#FFFCF7" stroke="#6B645C"/><g opacity="1"><circle cx="46.0" cy="119.1" r="6.1" fill="#111111"/><path fill="#B4442C" d="M43.0 125.2 h6.1 l9.9 22.0 h-25.8 z"/></g><rect x="66" y="110" width="32" height="44" fill="#FFFCF7" stroke="#6B645C"/><g opacity="1"><circle cx="82.0" cy="119.1" r="6.1" fill="#111111"/><path fill="#B4442C" d="M79.0 125.2 h6.