<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="t d"><title id="t">What a garment does to a moving body</title><desc id="d">Course diagram, a two-by-two map. Horizontal axis: the garment follows the body, or redesigns the body. Vertical axis: the garment amplifies motion, or restricts it. Top left, drape: Duncan tunics and Fortuny's Delphos follow and lengthen gesture. Top right, extension: Fuller's silk, wands and electric light turn the costume into the image. Bottom right, reorganisation: Schlemmer's Triadic figures let geometry dictate the step. Bottom left, tension: Graham's jersey tube makes the body push against cloth. All four are hypotheses to test against the clips.</desc><rect width="760" height="470" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="24" y="36" fill="#111111" font-size="20" text-anchor="start" font-weight="700">What does the garment do to movement?</text><text x="24" y="58" fill="#6B645C" font-size="12" text-anchor="start" font-weight="400" font-style="italic">Course hypothesis · test it against the clips</text><rect x="72" y="104" width="300" height="150" rx="6" fill="#FFFCF7" stroke="#111111" stroke-width="1.25"/><text x="88" y="134" fill="#2C5F8A" font-size="14" text-anchor="start" font-weight="700">DRAPE</text><text x="88" y="162" fill="#111111" font-size="13" text-anchor="start" font-weight="400">Duncan tunic · Fortuny Delphos</text><text x="88" y="182" fill="#111111" font-size="13" text-anchor="start" font-weight="400">cloth follows and lengthens</text><text x="88" y="202" fill="#111111" font-size="13" text-anchor="start" font-weight="400">the gesture</text><rect x="388" y="104" width="300" height="150" rx="6" fill="#FFFCF7" stroke="#111111" stroke-width="1.25"/><text x="404" y="134" fill="#B4442C" font-size="14" text-anchor="start" font-weight="700">EXTENSION</text><text x="404" y="162" fill="#111111" font-size="13" text-anchor="start" font-weight="400">Fuller: silk + wands + electric light</text><text x="404" y="182" fill="#111111" font-size="13" text-anchor="start" font-weight="400">the costume becomes</text><text x="404" y="202" fill="#111111" font-size="13" text-anchor="start" font-weight="400">the image</text><rect x="72" y="270" width="300" height="150" rx="6" fill="#FFFCF7" stroke="#111111" stroke-width="1.25"/><text x="88" y="300" fill="#B4442C" font-size="14" text-anchor="start" font-weight="700">TENSION</text><text x="88" y="328" fill="#111111" font-size="13" text-anchor="start" font-weight="400">Graham's jersey tube</text><text x="88" y="348" fill="#111111" font-size="13" text-anchor="start" font-weight="400">the body pushes against</text><text x="88" y="368" fill="#111111" font-size="13" text-anchor="start" font-weight="400">the cloth</text><rect x="388" y="270" width="300" height="150" rx="6" fill="#FFFCF7" stroke="#111111" stroke-width="1.25"/><text x="404" y="300" fill="#2C5F8A" font-size="14" text-anchor="start" font-weight="700">REORGANISATION</text><text x="404" y="328" fill="#111111" font-size="13" text-anchor="start" font-weight="400">Schlemmer's Triadic figures</text><text x="404" y="348" fill="#111111" font-size="13" text-anchor="start" font-weight="400">geometry dictates</text><text x="404" y="368" fill="#111111" font-size="13" text-anchor="start" font-weight="400">the step</text><path fill="none" stroke="#6B645C" stroke-width="2" stroke-linecap="round" d="M318 132 q10 30 20 0 t20 0 M318 146 q10 30 20 0 t20 0"/><path fill="none" stroke="#6B645C" stroke-width="2" stroke-linecap="round" d="M654 144 m-2 0 a6 6 0 1 1 6 6 a12 12 0 1 1 -12 -14 a18 18 0 1 1 18 22"/><rect fill="none" stroke="#6B645C" stroke-width="2" stroke-linecap="round" x="326" y="290" width="22" height="36" rx="10"/><path fill="none" stroke="#6B645C" stroke-width="2" stroke-linecap="round" d="M654 290 l18 12 l-6 22 h-24 l-6 -22 z"/><path stroke="#111111" stroke-width="1.5" fill="none" d="M70 262 H690"/><path stroke="#111111" stroke-width="1.5" fill="none" d="M380 84 V446"/><text x="72" y="446" fill="#6B645C" font-size="12" text-anchor="start" font-weight="400">← follows the body</text><text x="688" y="446" fill="#6B645C" font-size="12" text-anchor="end" font-weight="400">redesigns the body →</text><text x="388" y="80" fill="#6B645C" font-size="12" text-anchor="start" font-weight="400">↑ amplifies motion</text><text x="388" y="462" fill="#6B645C" font-size="12" text-anchor="start" font-weight="400">↓ restricts motion</text></g></svg>
