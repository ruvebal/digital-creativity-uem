<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="t d"><title id="t">Part 1 session flow, 120 minutes</title><desc id="d">Course diagram of Part 1. Minutes 0 to 15, Analysis of one film still. 15 to 55, Masterclass: the dressed body, flying cloth and one step, with films. 55 to 60, Lab opener. 60 to 85, Exercise 1, serpentine and light with the phone camera. 85 to 110, Exercise 2, one image of time from a burst. 110 to 120, share.</desc><rect width="760" height="200" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="24" y="36" fill="#111111" font-size="20" text-anchor="start" font-weight="700">Part 1 · 120′ · how the session runs</text><rect x="25.0" y="60" width="87.0" height="54" rx="4" fill="#EFE6D6" stroke="#111111" stroke-width="1"/><text x="26.0" y="150" fill="#111111" font-size="11.5" text-anchor="start" font-weight="700">Analysis</text><text x="26.0" y="166" fill="#6B645C" font-size="10.5" text-anchor="start" font-weight="400">1 still · 8 steps</text><text x="25.0" y="130" fill="#6B645C" font-size="10.5" text-anchor="start" font-weight="400">0′</text><rect x="114.0" y="60" width="235.3" height="54" rx="4" fill="#2C5F8A" stroke="#111111" stroke-width="1"/><text x="121.0" y="82" fill="#FFFCF7" font-size="12.5" text-anchor="start" font-weight="700">Masterclass</text><text x="121.0" y="102" fill="#FFFCF7" font-size="11" text-anchor="start" font-weight="400">6 slides · films</text><text x="114.0" y="130" fill="#6B645C" font-size="10.5" text-anchor="start" font-weight="400">15′</text><rect x="351.3" y="60" width="27.7" height="54" rx="4" fill="#111111" stroke="#111111" stroke-width="1"/><text x="365.16666666666663" y="150" fill="#111111" font-size="11.5" text-anchor="middle" font-weight="700">Lab</text><text x="365.16666666666663" y="166" fill="#6B645C" font-size="10.5" text-anchor="middle" font-weight="400">opener</text><text x="351.3333333333333" y="130" fill="#6B645C