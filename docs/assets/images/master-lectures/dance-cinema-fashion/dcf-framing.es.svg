<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t d"><title id="t">Encuadrar y montar un cuerpo vestido que baila</title><desc id="d">Diagrama del curso. Una figura de pie con falda larga aparece con tres encuadres de cámara: figura entera, plano medio de cintura arriba, y primer plano de cara y manos. Al lado, dos líneas de tiempo de los mismos treinta segundos: una toma continua y seis cortes. Preguntas: qué muestra cada encuadre del movimiento de la prenda, y qué oculta cada corte.</desc><rect width="760" height="430" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="24" y="36" fill="#111111" font-size="20" text-anchor="start" font-weight="700">El mismo baile, otra película</text><text x="24" y="58" fill="#6B645C" font-size="12" text-anchor="start" font-weight="400" font-style="italic">El tamaño del plano decide qué puede mostrar la prenda</text><circle cx="150" cy="118" r="16" fill="#111111"/><path fill="#111111" d="M136 140 h28 l6 70 l-40 0 z"/><path fill="#B4442C" opacity=".85" d="M130 208 h40 l52 170 q-72 22 -144 0 z"/><path stroke="#111111" stroke-width="7" stroke-linecap="round" d="M136 148 l-46 -38 M164 148 l44 34"/><path stroke="#111111" stroke-width="7" stroke-linecap="round" d="M140 376 l-8 26 M160 376 l14 24"/><rect x="40" y="90" width="220" height="326" fill="none" stroke="#2C5F8A" stroke-width="2" stroke-dasharray="6 4"/><rect x="72" y="90" width="156" height="140" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="6 4"/><rect x="110" y="96" width="80" height="60" fill="none" stroke="#B4442C" stroke-width="2" stroke-dasharray="6 4"/><text x="40" y="436" fill="#2C5F8A" font-size="11" text-anchor="start" font-weight="700">FIGURA ENTERA</text><text x="232" y="242" fill="#111111" font-size="11" text-anchor="start" font-weight="700">PLANO MEDIO</text><text x="194" y="110" fill="#B4442C" font-size="11" text-anchor="start" font-weight="700">PRIMER PLANO</text><text x="330" y="112" fill="#6B645C" font-size="13" text-anchor="start" font-weight="400">30 segundos de la misma coreografía</text><text x="330" y="146" fill="#111111" font-size="13" text-anchor="start" font-weight="700">A · una toma</text><rect x="330" y="156" width="400" height="26" rx="3" fill="#2C5F8A"/><text x="330" y="216" fill="#111111" font-size="13" text-anchor="start" font-weight="700">B · seis cortes</text><rect x="331" y="226" width="70" height="26" rx="3" fill="#2C5F8A"/><rect x="403" y="226" width="50" height="26" rx="3" fill="#B4442C"/><rect x="455" y="226" width="82" height="26" rx="3" fill="#111111"/><rect x="539" y="226" width="42" height="26" rx="3" fill="#2C5F8A"/><rect x="583" y="226" width="74" height="26" rx="3" fill="#B4442C"/><rect x="659" y="226" width="70" height="26" rx="3" fill="#111111"/><circle cx="338" cy="292" r="9" fill="#EFE6D6" stroke="#111111"/><text x="338" y="296" fill="#111111" font-size="11" text-anchor="middle" font-weight="700">1</text><text x="356" y="297" fill="#111111" font-size="13" text-anchor="start" font-weight="400">¿Están los pies y el bajo dentro del plano?</text><circle cx="338" cy="326" r="9" fill="#EFE6D6" stroke="#111111"/><text x="338" y="330" fill="#111111" font-size="11" text-anchor="middle" font-weight="700">2</text><text x="356" y="331" fill="#111111" font-size="13" text-anchor="start" font-weight="400">¿Quién decide el corte: bailarina, dirección, montaje?</text><circle cx="338" cy="360" r="9" fill="#EFE6D6" stroke="#111111"/><text x="338" y="364" fill="#111111" font-size="11" text-anchor="middle" font-weight="700">3</text><text x="356" y="365" fill="#111111" font-size="13" text-anchor="start" font-weight="400">¿Qué vende el primer plano: el vestido o la estrella?</text></g></svg>
