<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="t d"><title id="t">Escalera de evidencia para un movimiento que viaja</title><desc id="d">Diagrama del curso, una escalera de cuatro peldaños de la evidencia más débil a la más fuerte. Peldaño 1, analogía visual: se parece; solo necesita ojos; nunca basta sola. Peldaño 2, cita: un título, crédito o declaración nombra la fuente. Peldaño 3, intercambio: un registro fechado muestra que las personas trabajaron juntas. Peldaño 4, influencia documentada: testimonio, fechas y obras coinciden. Dos ejemplos: el solo de Kazuo Ohno de 1977 lleva el nombre de la bailarina La Argentina, a quien vio bailar décadas antes; las fuentes dan 1926, 1927 o 1929. Los plisados de Issey Miyake para el Ballet de Frankfurt de William Forsythe, 1991 o 1992, se describen como prototipo de Pleats Please, lanzado en 1993. Un panel lateral dice que la apropiación no es un peldaño sino una cuestión de poder: a quién se acredita, se paga o se desplaza.</desc><rect width="760" height="470" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="24" y="36" fill="#111111" font-size="20" text-anchor="start" font-weight="700">¿Cómo sabemos que un movimiento viajó?</text><text x="24" y="58" fill="#6B645C" font-size="12" text-anchor="start" font-weight="400" font-style="italic">Sube solo hasta donde llegue tu evidencia</text><path stroke="#111111" stroke-width="3" d="M40 446 V90 M64 446 V90"/><path stroke="#111111" stroke-width="3" d="M40 418 H64"/><rect x="80" y="394" width="372" height="54" rx="6" fill="#FFFCF7" stroke="#111111" stroke-width="1.25"/><text x="94" y="415" fill="#B4442C" font-size="13" text-anchor="start" font-weight="700">1 · ANALOGÍA VISUAL</text><text x="94" y="436" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">«Se parece a…» — solo pide ojos. Nunca basta sola.</text><path stroke="#111111" stroke-width="3" d="M40 332 H64"/><rect x="80" y="308" width="372" height="54" rx="6" fill="#FFFCF7" stroke="#111111" stroke-width="1.25"/><text x="94" y="329" fill="#111111" font-size="13" text-anchor="start" font-weight="700">2 · CITA</text><text x="94" y="350" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">Un título, crédito o declaración nombra la fuente.</text><path stroke="#111111" stroke-width="3" d="M40 246 H64"/><rect x="80" y="222" width="372" height="54" rx="6" fill="#FFFCF7" stroke="#111111" stroke-width="1.25"/><text x="94" y="243" fill="#111111" font-size="13" text-anchor="start" font-weight="700">3 · INTERCAMBIO</text><text x="94" y="264" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">Un registro fechado muestra que trabajaron juntos.</text><path stroke="#111111" stroke-width="3" d="M40 160 H64"/><rect x="80" y="136" width="372" height="54" rx="6" fill="#FFFCF7" stroke="#111111" stroke-width="1.25"/><text x="94" y="157" fill="#2C5F8A" font-size="13" text-anchor="start" font-weight="700">4 · INFLUENCIA DOCUMENTADA</text><text x="94" y="178" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">Testimonio + fechas + obras coinciden.</text><rect x="468" y="84" width="272" height="232" rx="6" fill="#EFE6D6"/><text x="482" y="108" fill="#111111" font-size="12" text-anchor="start" font-weight="700">Kazuo Ohno,</text><text x="482" y="125" fill="#111111" font-size="12" text-anchor="start" font-weight="700" font-style="italic">Admiring La Argentina (1977)</text><text x="482" y="144" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">El título nombra a Antonia Mercé (2).</text><text x="482" y="160" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">¿Cuándo la vio bailar?</text><text x="482" y="176" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">¿1926? ¿1927? ¿1929? No coinciden.</text><text x="482" y="220" fill="#111111" font-size="12" text-anchor="start" font-weight="700">Forsythe × Miyake</text><text x="482" y="237" fill="#111111" font-size="12" text-anchor="start" font-weight="700" font-style="italic">Ballet de Fráncfort, 1991 o 1992</text><text x="482" y="256" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">Plisados para bailarines</text><text x="482" y="272" fill="#111111" font-size="11.5" text-anchor="start" font-weight="400">→ Pleats Please, 1993 (peldaño 3).</text><rect x="468" y="330" width="272" height="116" rx="6" fill="#FFFCF7" stroke="#B4442C" stroke-width="2"/><text x="484" y="354" fill="#B4442C" font-size="13" text-anchor="start" font-weight="700">LA APROPIACIÓN</text><text x="484" y="374" fill="#111111" font-size="12" text-anchor="start" font-weight="400">no es un peldaño. Es una cuestión</text><text x="484" y="391" fill="#111111" font-size="12" text-anchor="start" font-weight="400">de poder: ¿a quién se acredita, se paga,</text><text x="484" y="408" fill="#111111" font-size="12" text-anchor="start" font-weight="400">se desplaza?</text></g></svg>
