<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="t d"><title id="t">Qué le hace una prenda a un cuerpo en movimiento</title><desc id="d">Diagrama del curso, un mapa de dos por dos. Eje horizontal: la prenda sigue al cuerpo, o rediseña el cuerpo. Eje vertical: la prenda amplifica el movimiento, o lo restringe. Arriba a la izquierda, drapeado: túnicas de Duncan y el Delphos de Fortuny siguen y alargan el gesto. Arriba a la derecha, extensión: la seda, las varillas y la luz eléctrica de Fuller convierten el vestuario en imagen. Abajo a la derecha, reorganización: las figuras triádicas de Schlemmer dejan que la geometría dicte el paso. Abajo a la izquierda, tensión: el tubo de punto de Graham hace que el cuerpo empuje contra la tela. Las cuatro son hipótesis que se contrastan con los vídeos.</desc><rect width="760" height="470" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="24" y="36" fill="#111111" font-size="20" text-anchor="start" font-weight="700">¿Qué le hace la prenda al movimiento?</text><text x="24" y="58" fill="#6B645C" font-size="12" text-anchor="start" font-weight="400" font-style="italic">Hipótesis del curso · contrástala con los vídeos</text><rect x="72" y="104" width="300" height="150" rx="6" fill="#FFFCF7" stroke="#111111" stroke-width="1.25"/><text x="88" y="134" fill="#2C5F8A" font-size="14" text-anchor="start" font-weight="700">DRAPEADO</text><text x="88" y="162" fill="#111111" font-size="13" text-anchor="start" font-weight="400">Túnica Duncan · Delphos de Fortuny</text><text x="88" y="182" fill="#111111" font-size="13" text-anchor="start" font-weight="400">la tela sigue y alarga</text><text x="88" y="202" fill="#111111" font-size="13" text-anchor="start" font-weight="400">el gesto</text><rect x="388" y="104" width="300" height="150" rx="6" fill="#FFFCF7" stroke="#111111" stroke-width="1.25"/><text x="404" y="134" fill="#B4442C" font-size="14" text-anchor="start" font-weight="700">EXTENSIÓN</text><text x="404" y="162" fill="#111111" font-size="13" text-anchor="start" font-weight="400">Fuller: seda + varillas + luz eléctrica</text><text x="404" y="182" fill="#111111" font-size="13" text-anchor="start" font-weight="400">el vestuario se vuelve</text><text x="404" y="202" fill="#111111" font-size="13" text-anchor="start" font-weight="400">imagen</text><rect x="72" y="270" width="300" height="150" rx="6" fill="#FFFCF7" stroke="#111111" stroke-width="1.25"/><text x="88" y="300" fill="#B4442C" font-size="14" text-anchor="start" font-weight="700">TENSIÓN</text><text x="88" y="328" fill="#111111" font-size="13" text-anchor="start" font-weight="400">El tubo de punto de Graham</text><text x="88" y="348" fill="#111111" font-size="13" text-anchor="start" font-weight="400">el cuerpo empuja contra</text><text x="88" y="368" fill="#111111" font-size="13" text-anchor="start" font-weight="400">la tela</text><rect x="388" y="270" width="300" height="150" rx="6" fill="#FFFCF7" stroke="#111111" stroke-width="1.25"/><text x="404" y="300" fill="#2C5F8A" font-size="14" text-anchor="start" font-weight="700">REORGANIZACIÓN</text><text x="404" y="328" fill="#111111" font-size="13" text-anchor="start" font-weight="400">Figuras triádicas de Schlemmer</text><text x="404" y="348" fill="#111111" font-size="13" text-anchor="start" font-weight="400">la geometría dicta</text><text x="404" y="368" fill="#111111" font-size="13" text-anchor="start" font-weight="400">el paso</text><path fill="none" stroke="#6B645C" stroke-width="2" stroke-linecap="round" d="M318 132 q10 30 20 0 t20 0 M318 146 q10 30 20 0 t20 0"/><path fill="none" stroke="#6B645C" stroke-width="2" stroke-linecap="round" d="M654 144 m-2 0 a6 6 0 1 1 6 6 a12 12 0 1 1 -12 -14 a18 18 0 1 1 18 22"/><rect fill="none" stroke="#6B645C" stroke-width="2" stroke-linecap="round" x="326" y="290" width="22" height="36" rx="10"/><path fill="none" stroke="#6B645C" stroke-width="2" stroke-linecap="round" d="M654 290 l18 12 l-6 22 h-24 l-6 -22 z"/><path stroke="#111111" stroke-width="1.5" fill="none" d="M70 262 H690"/><path stroke="#111111" stroke-width="1.5" fill="none" d="M380 84 V446"/><text x="72" y="446" fill="#6B645C" font-size="12" text-anchor="start" font-weight="400">← sigue al cuerpo</text><text x="688" y="446" fill="#6B645C" font-size="12" text-anchor="end" font-weight="400">rediseña el cuerpo →</text><text x="388" y="80" fill="#6B645C" font-size="12" text-anchor="start" font-weight="400">↑ amplifica el movimiento</text><text x="388" y="462" fill="#6B645C" font-size="12" text-anchor="start" font-weight="400">↓ restringe el movimiento</text></g></svg>
