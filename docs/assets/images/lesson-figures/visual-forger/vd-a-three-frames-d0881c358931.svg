<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">Three ways to explain seeing depth</title><desc id="d">Course diagram with three columns. Helmholtz, 1867, inference: the brain makes its best guess about the world from past experience; studio test, move the light and see whether a fold flips from hollow to bump. Gibson, 1979, pick-up: a moving viewer finds depth already in the light, in flow, texture and horizon; studio test, walk around the garment. Marr, 1982, computation: seeing builds stages, image, sketch, a two-and-a-half-D sketch, then a 3-D model; studio test, name the stage your software is working at. Caption: one studio question for all three, what does my picture let a viewer infer?</desc><rect width="1600" height="900" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="64" y="86" fill="#111111" font-size="46" text-anchor="start" font-weight="700" font-style="normal">Three ways to explain seeing depth</text><text x="64" y="132" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="italic">Use them as studio frames, not as exam dogma</text><rect x="64" y="176" width="464" height="590" rx="18" fill="#FFFCF7" stroke="#111111" stroke-width="2"/><text x="96" y="240" fill="#111111" font-size="40" text-anchor="start" font-weight="700" font-style="normal">Helmholtz</text><text x="496" y="240" fill="#6B645C" font-size="30" text-anchor="end" font-weight="400" font-style="normal">1867</text><rect x="96" y="266" width="400" height="56" rx="10" fill="#2C5F8A"/><text x="296.0" y="304" fill="#FFFCF7" font-size="30" text-anchor="middle" font-weight="700" font-style="normal">Inference</text><text x="96" y="380" fill="#111111" font-size="30" text-anchor="start" font-weight="400" font-style="normal">The brain makes its best</text><text x="96" y="422" fill="#111111" font-size="30" text-anchor="start" font-weight="400" font-style="normal">guess about the world from</text><text x="96" y="464" fill="#111111" font-size="30" text-anchor="start" font-weight="400" font-style="normal">past experience.</text><line x1="96" y1="500" x2="496" y2="500" stroke="#6B645C" stroke-width="1.5"/><text x="96" y="540" fill="#6B645C" font-size="27" text-anchor="start" font-weight="400" font-style="italic">Studio test: move the light.</text><text x="96" y="578" fill="#6B645C" font-size="27" text-anchor="start" font-weight="400" font-style="italic">Does the fold flip from</text><text x="96" y="616" fill="#6B645C" font-size="27" text-anchor="start" font-weight="400" font-style="italic">hollow to bump?</text><rect x="560" y="176" width="464" height="590" rx="18" fill="#FFFCF7" stroke="#111111" stroke-width="2"/><text x="592" y="240" fill="#111111" font-size="40" text-anchor="start" font-weight="700" font-style="normal">Gibson</text><text x="992" y="240" fill="#6B645C" font-size="30" text-anchor="end" font-weight="400" font-style="normal">1979</text><rect x="592" y="266" width="400" height="56" rx="10" fill="#B4442C"/><text x="792.0" y="304" fill="#FFFCF7" font-size="30" text-anchor="middle" font-weight="700" font-style="normal">Pick-up</text><text x="592" y="380" fill="#111111" font-size="30" text-anchor="start" font-weight="400" font-style="normal">A moving viewer finds</text><text x="592" y="422" fill="#111111" font-size="30" text-anchor="start" font-weight="400" font-style="normal">depth already in the</text><text x="592" y="464" fill="#111111" font-size="30" text-anchor="start" font-weight="400" font-style="normal">light: flow, texture,</text><text x="592" y="506" fill="#111111" font-size="30" text-anchor="start" font-weight="400" font-style="normal">horizon.</text><line x1="592" y1="542" x2="992" y2="542" stroke="#6B645C" stroke-width="1.5"/><text x="592" y="582" fill="#6B645C" font-size="27" text-anchor="start" font-weight="400" font-style="italic">Studio test: walk around the</text><text x="592" y="620" fill="#6B645C" font-size="27" text-anchor="start" font-weight="400" font-style="italic">garment. What changes, what</text><text x="592" y="658" fill="#6B645C" font-size="27" text-anchor="start" font-weight="400" font-style="italic">stays?</text><rect x="1056" y="176" width="464" height="590" rx="18" fill="#FFFCF7" stroke="#111111" stroke-width="2"/><text x="1088" y="240" fill="#111111" font-size="40" text-anchor="start" font-weight="700" font-style="normal">Marr</text><text x="1488" y="240" fill="#6B645C" font-size="30" text-anchor="end" font-weight="400" font-style="normal">1982</text><rect x="1088" y="266" width="400" height="56" rx="10" fill="#2C5F8A"/><text x="1288.0" y="304" fill="#FFFCF7" font-size="30" text-anchor="middle" font-weight="700" font-style="normal">Computation</text><text x="1088" y="380" fill="#111111" font-size="30" text-anchor="start" font-weight="400" font-style="normal">Seeing builds stages:</text><text x="1088" y="422" fill="#111111" font-size="30" text-anchor="start" font-weight="400" font-style="normal">image, sketch, a 2½-D</text><text x="1088" y="464" fill="#111111" font-size="30" text-anchor="start" font-weight="400" font-style="normal">sketch, then a 3-D model.</text><line x1="1088" y1="500" x2="1488" y2="500" stroke="#6B645C" stroke-width="1.5"/><text x="1088" y="540" fill="#6B645C" font-size="27" text-anchor="start" font-weight="400" font-style="italic">Studio test: name the stage</text><text x="1088" y="578" fill="#6B645C" font-size="27" text-anchor="start" font-weight="400" font-style="italic">your software is really</text><text x="1088" y="616" fill="#6B645C" font-size="27" text-anchor="start" font-weight="400" font-style="italic">working at.</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#111111" stroke-width="1.5"/><text x="64" y="856" fill="#111111" font-size="26" text-anchor="start" font-weight="600" font-style="normal">One studio question for all three: what does my picture let a viewer infer?</text></g></svg>
