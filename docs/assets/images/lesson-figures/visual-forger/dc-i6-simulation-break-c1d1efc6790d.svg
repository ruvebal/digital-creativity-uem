<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Supported material versus unsupported virtual contour</title>
<desc id="d">Left: cloth ends at the posts. Right: virtual contour continues past the support. Only the volume constructions orbit; panel frames stay still.</desc>

<style>
  /* Orbit the represented volume only — never the panel/frame. */
  .orb-volume {
    transform-box: fill-box;
    transform-origin: 50% 62%;
  }
  @media (prefers-reduced-motion: no-preference) {
    .orb-volume {
      animation: volume-orb 8.5s ease-in-out infinite;
    }
    .orb-volume--b { animation-delay: -2.8s; }
    .orb-volume--c { animation-delay: -5.2s; }
  }
  @keyframes volume-orb {
    /* Fake yaw of an isometric solid: shear + slight rotate + depth scale */
    0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1, 1); }
    25% { transform: translate(5px, -2px) rotate(-1.4deg) scale(1.015, 0.985); }
    50% { transform: translate(0, -3px) rotate(0deg) scale(1.02, 0.98); }
    75% { transform: translate(-5px, -2px) rotate(1.4deg) scale(1.015, 0.985); }
  }
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1a1524"/><stop offset="100%" stop-color="#121018"/>
  </linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="60" y="70" width="720" height="760" rx="10" fill="#1a1622" stroke="#3d374c" stroke-width="1.5"/>
<rect x="820" y="70" width="720" height="760" rx="10" fill="#1a1622" stroke="#3d374c" stroke-width="1.5"/>
<text x="420.0" y="125.0" fill="#f07c63" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="26" text-anchor="middle">supported material</text>
<text x="1180.0" y="125.0" fill="#9be2d1" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="26" text-anchor="middle">unsupported virtual</text>
<line x1="790.0" y1="450.0" x2="830.0" y2="450.0" stroke="#f07c63" stroke-width="3" opacity="0.85" stroke-linecap="round"/>
<path d="M815.0 438.0 L838.0 450.0 L815.0 462.0 Z" fill="#f07c63" stroke="#f07c63" stroke-width="1" opacity="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="420.0" y="790.0" fill="#9a93a6" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="18" text-anchor="middle">ends at the support</text>
<text x="1180.0" y="790.0" fill="#e8c56c" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="17" text-anchor="middle">hold: support · change: contour</text>
