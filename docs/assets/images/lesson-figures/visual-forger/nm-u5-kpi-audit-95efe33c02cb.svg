<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">Ficha de auditoría de un KPI</title><desc id="d">Diagrama del curso: cinco preguntas para auditar la tasa de engagement de una cuenta de moda. Qué cuenta: interacciones divididas por seguidores, por publicación. Qué deja fuera: quién no puede ver, quién mira sin reaccionar y lo que pasa fuera de la app. Quién produce el dato: la plataforma, con su algoritmo y su definición de alcance. Qué decisión provoca: publicar más de lo que ya funcionó y premiar lo llamativo. Qué prueba falta, en rojo: si alguien cambió una conducta, como comprar menos, reparar o firmar. Pie: rellena la ficha antes de poner el número en tu informe.</desc><rect width="1600" height="900" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="64" y="86" fill="#111111" font-size="46" text-anchor="start" font-weight="700" font-style="normal">Ficha de auditoría de un KPI</text><text x="64" y="132" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="italic">Ejemplo: «tasa de engagement» de una cuenta de moda</text><rect x="64" y="190" width="1472" height="104" rx="12" fill="#FFFCF7" stroke="#111111" stroke-width="2"/><text x="96" y="254" fill="#111111" font-size="32" text-anchor="start" font-weight="700" font-style="normal">¿Qué cuenta?</text><text x="560" y="254" fill="#111111" font-size="26" text-anchor="start" font-weight="400" font-style="normal">interacciones ÷ seguidores, por publicación</text><rect x="64" y="310" width="1472" height="104" rx="12" fill="#EFE6D6" stroke="#111111" stroke-width="2"/><text x="96" y="374" fill="#111111" font-size="32" text-anchor="start" font-weight="700" font-style="normal">¿Qué deja fuera?</text><text x="560" y="374" fill="#111111" font-size="26" text-anchor="start" font-weight="400" font-style="normal">quién no puede ver, quién mira sin reaccionar, lo que pasa fuera de la app</text><rect x="64" y="430" width="1472" height="104" rx="12" fill="#FFFCF7" stroke="#111111" stroke-width="2"/><text x="96" y="494" fill="#111111" font-size="32" text-anchor="start" font-weight="700" font-style="normal">¿Quién produce el dato?</text><text x="560" y="494" fill="#111111" font-size="26" text-anchor="start" font-weight="400" font-style="normal">la plataforma, con su propio algoritmo y su definición de «alcance»</text><rect x="64" y="550" width="1472" height="104" rx="12" fill="#EFE6D6" stroke="#111111" stroke-width="2"/><text x="96" y="614" fill="#111111" font-size="32" text-anchor="start" font-weight="700" font-style="normal">¿Qué decisión provoca?</text><text x="560" y="614" fill="#111111" font-size="26" text-anchor="start" font-weight="400" font-style="normal">publicar más de lo que ya funcionó; premiar lo llamativo</text><rect x="64" y="670" width="1472" height="104" rx="12" fill="#FFFCF7" stroke="#B4442C" stroke-width="3"/><text x="96" y="734" fill="#B4442C" font-size="32" text-anchor="start" font-weight="700" font-style="normal">¿Qué prueba falta?</text><text x="560" y="734" fill="#111111" font-size="26" text-anchor="start" font-weight="400" font-style="normal">si alguien cambió una conducta: comprar menos, reparar, firmar</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#111111" stroke-width="1.5"/><text x="64" y="856" fill="#111111" font-size="26" text-anchor="start" font-weight="600" font-style="normal">Rellena la ficha antes de poner el número en tu informe.</text></g></svg>
