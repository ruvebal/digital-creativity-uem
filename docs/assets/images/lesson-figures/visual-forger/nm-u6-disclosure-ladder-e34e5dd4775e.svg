<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">La escalera de la divulgación</title><desc id="d">Diagrama del curso: cinco peldaños. 0, nada declarado: la imagen se presenta como fotografía. 1, letra pequeña: un aviso que casi nadie ve. 2, etiqueta visible junto a la imagen, imagen generada con IA. 3, proceso declarado: herramienta, datos de partida y personas que intervinieron. 4, proceso más consentimiento y crédito: quién posó, quién cobró, quién firmó. Nota lateral: el Reglamento europeo de IA, artículo 50, exige revelar como tales ciertos contenidos generados con IA. Pie: la ley marca un mínimo; tu decisión editorial puede ir más arriba.</desc><rect width="1600" height="900" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="64" y="86" fill="#111111" font-size="46" text-anchor="start" font-weight="700" font-style="normal">La escalera de la divulgación</text><text x="64" y="132" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="italic">¿Cuánto sabe quien mira sobre cómo se hizo la imagen?</text><rect x="110" y="664" width="860" height="100" rx="10" fill="#FFFCF7" stroke="#B4442C" stroke-width="3"/><text x="140" y="720" fill="#B4442C" font-size="36" text-anchor="middle" font-weight="700" font-style="normal">0</text><text x="182" y="708" fill="#111111" font-size="28" text-anchor="start" font-weight="700" font-style="normal">Nada declarado</text><text x="182" y="742" fill="#6B645C" font-size="22" text-anchor="start" font-weight="400" font-style="italic">la imagen se presenta como fotografía</text><rect x="180" y="552" width="860" height="100" rx="10" fill="#EFE6D6" stroke="#B4442C" stroke-width="3"/><text x="210" y="608" fill="#B4442C" font-size="36" text-anchor="middle" font-weight="700" font-style="normal">1</text><text x="252" y="596" fill="#111111" font-size="28" text-anchor="start" font-weight="700" font-style="normal">Letra pequeña</text><text x="252" y="630" fill="#6B645C" font-size="22" text-anchor="start" font-weight="400" font-style="italic">un aviso que casi nadie ve</text><rect x="250" y="440" width="860" height="100" rx="10" fill="#FFFCF7" stroke="#2C5F8A" stroke-width="3"/><text x="280" y="496" fill="#2C5F8A" font-size="36" text-anchor="middle" font-weight="700" font-style="normal">2</text><text x="322" y="484" fill="#111111" font-size="28" text-anchor="start" font-weight="700" font-style="normal">Etiqueta visible</text><text x="322" y="518" fill="#6B645C" font-size="22" text-anchor="start" font-weight="400" font-style="italic">«imagen generada con IA» junto a la imagen</text><rect x="320" y="328" width="860" height="100" rx="10" fill="#EFE6D6" stroke="#111111" stroke-width="3"/><text x="350" y="384" fill="#111111" font-size="36" text-anchor="middle" font-weight="700" font-style="normal">3</text><text x="392" y="372" fill="#111111" font-size="28" text-anchor="start" font-weight="700" font-style="normal">Proceso declarado</text><text x="392" y="406" fill="#6B645C" font-size="22" text-anchor="start" font-weight="400" font-style="italic">herramienta, datos de partida y personas que intervinieron</text><rect x="390" y="216" width="860" height="100" rx="10" fill="#FFFCF7" stroke="#111111" stroke-width="3"/><text x="420" y="272" fill="#111111" font-size="36" text-anchor="middle" font-weight="700" font-style="normal">4</text><text x="462" y="260" fill="#111111" font-size="28" text-anchor="start" font-weight="700" font-style="normal">Proceso + consentimiento + crédito</text><text x="462" y="294" fill="#6B645C" font-size="22" text-anchor="start" font-weight="400" font-style="italic">quién posó, quién cobró, quién firmó</text><text x="1536" y="420" fill="#2C5F8A" font-size="22" text-anchor="end" font-weight="700" font-style="normal">Reglamento (UE) 2024/1689,</text><text x="1536" y="450" fill="#2C5F8A" font-size="22" text-anchor="end" font-weight="400" font-style="normal">art. 50: ciertos contenidos</text><text x="1536" y="480" fill="#2C5F8A" font-size="22" text-anchor="end" font-weight="400" font-style="normal">generados con IA deben</text><text x="1536" y="510" fill="#2C5F8A" font-size="22" text-anchor="end" font-weight="400" font-style="normal">revelarse como tales</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#111111" stroke-width="1.5"/><text x="64" y="856" fill="#111111" font-size="26" text-anchor="start" font-weight="600" font-style="normal">La ley marca un mínimo; tu decisión editorial puede ir más arriba.</text></g></svg>
