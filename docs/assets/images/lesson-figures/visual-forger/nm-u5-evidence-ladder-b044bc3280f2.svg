<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">La escalera de la evidencia</title><desc id="d">Diagrama del curso: seis peldaños ascendentes. 0 exposición: impresiones y alcance, dato de la plataforma. 1 interacción: me gusta, comentarios y guardados, plataforma. 2 acción: clic, visita o registro, marca. 3 conversión: compra, firma o reserva, marca. 4 cambio declarado: encuesta, intención o recuerdo, marca o tercero. 5 resultado independiente: auditoría, inspección o dato público, tercero independiente, en rojo. Pie: sube solo tan alto como te permita tu evidencia; marco operativo del curso.</desc><rect width="1600" height="900" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="64" y="86" fill="#111111" font-size="46" text-anchor="start" font-weight="700" font-style="normal">La escalera de la evidencia</text><text x="64" y="132" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="italic">Cada peldaño responde a una pregunta distinta; ninguno sustituye al de arriba</text><rect x="110" y="678" width="820" height="74" rx="10" fill="#FFFCF7" stroke="#6B645C" stroke-width="3"/><text x="138" y="724" fill="#6B645C" font-size="34" text-anchor="middle" font-weight="700" font-style="normal">0</text><text x="174" y="724" fill="#111111" font-size="28" text-anchor="start" font-weight="700" font-style="normal">Exposición</text><text x="910" y="724" fill="#111111" font-size="21" text-anchor="end" font-weight="400" font-style="normal">impresiones, alcance, visualizaciones</text><text x="1536" y="724" fill="#6B645C" font-size="22" text-anchor="end" font-weight="600" font-style="italic">plataforma</text><rect x="170" y="586" width="820" height="74" rx="10" fill="#EFE6D6" stroke="#6B645C" stroke-width="3"/><text x="198" y="632" fill="#6B645C" font-size="34" text-anchor="middle" font-weight="700" font-style="normal">1</text><text x="234" y="632" fill="#111111" font-size="28" text-anchor="start" font-weight="700" font-style="normal">Interacción</text><text x="970" y="632" fill="#111111" font-size="21" text-anchor="end" font-weight="400" font-style="normal">me gusta, comentarios, guardados</text><text x="1536" y="632" fill="#6B645C" font-size="22" text-anchor="end" font-weight="600" font-style="italic">plataforma</text><rect x="230" y="494" width="820" height="74" rx="10" fill="#FFFCF7" stroke="#6B645C" stroke-width="3"/><text x="258" y="540" fill="#6B645C" font-size="34" text-anchor="middle" font-weight="700" font-style="normal">2</text><text x="294" y="540" fill="#111111" font-size="28" text-anchor="start" font-weight="700" font-style="normal">Acción</text><text x="1030" y="540" fill="#111111" font-size="21" text-anchor="end" font-weight="400" font-style="normal">clic, visita, registro</text><text x="1536" y="540" fill="#6B645C" font-size="22" text-anchor="end" font-weight="600" font-style="italic">marca</text><rect x="290" y="402" width="820" height="74" rx="10" fill="#EFE6D6" stroke="#2C5F8A" stroke-width="3"/><text x="318" y="448" fill="#2C5F8A" font-size="34" text-anchor="middle" font-weight="700" font-style="normal">3</text><text x="354" y="448" fill="#111111" font-size="28" text-anchor="start" font-weight="700" font-style="normal">Conversión</text><text x="1090" y="448" fill="#111111" font-size="21" text-anchor="end" font-weight="400" font-style="normal">compra, firma, reserva</text><text x="1536" y="448" fill="#2C5F8A" font-size="22" text-anchor="end" font-weight="600" font-style="italic">marca</text><rect x="350" y="310" width="820" height="74" rx="10" fill="#FFFCF7" stroke="#2C5F8A" stroke-width="3"/><text x="378" y="356" fill="#2C5F8A" font-size="34" text-anchor="middle" font-weight="700" font-style="normal">4</text><text x="414" y="356" fill="#111111" font-size="28" text-anchor="start" font-weight="700" font-style="normal">Cambio declarado</text><text x="1150" y="356" fill="#111111" font-size="21" text-anchor="end" font-weight="400" font-style="normal">encuesta, intención, recuerdo</text><text x="1536" y="356" fill="#2C5F8A" font-size="22" text-anchor="end" font-weight="600" font-style="italic">marca o tercero</text><rect x="410" y="218" width="820" height="74" rx="10" fill="#EFE6D6" stroke="#B4442C" stroke-width="3"/><text x="438" y="264" fill="#B4442C" font-size="34" text-anchor="middle" font-weight="700" font-style="normal">5</text><text x="474" y="264" fill="#111111" font-size="28" text-anchor="start" font-weight="700" font-style="normal">Resultado independiente</text><text x="1210" y="264" fill="#111111" font-size="21" text-anchor="end" font-weight="400" font-style="normal">auditoría, inspección, dato público</text><text x="1536" y="264" fill="#B4442C" font-size="22" text-anchor="end" font-weight="600" font-style="italic">tercero independiente</text><text x="1536" y="170" fill="#6B645C" font-size="22" text-anchor="end" font-weight="700" font-style="normal">¿Quién produce el dato?</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#111111" stroke-width="1.5"/><text x="64" y="856" fill="#111111" font-size="26" text-anchor="start" font-weight="600" font-style="normal">Sube solo tan alto como te permita tu evidencia. Marco operativo del curso.</text></g></svg>
