<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">Who decides what counts as volume?</title><desc id="d">Course diagram, a loop of five boxes joined by arrows. Intention, what the garment must do, a human decision. Constraints, prompt, references and parameters, a human decision. Proposal, the tool explores its learned space, a machine move. Judgement, select, reject and say why, a human decision. Revision and declaration, change, test and credit the process, a human decision, which leads back to intention. In the centre: trace kept, prompt, seed, rejects and reasons. Caption: the tool can explore a space; judging value, and signing it, stays with the designer.</desc><rect width="1600" height="900" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B645C"/></marker></defs><text x="64" y="86" fill="#111111" font-size="46" text-anchor="start" font-weight="700" font-style="normal">Who decides what counts as volume?</text><text x="64" y="132" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="italic">A human–machine studio loop: the tool proposes, the designer judges and signs</text><path d="M923 272 Q1041 277 1086 341" stroke="#6B645C" stroke-width="4" fill="none" marker-end="url(#ah)"/><path d="M1162 477 Q1190 544 1100 588" stroke="#6B645C" stroke-width="4" fill="none" marker-end="url(#ah)"/><path d="M901 672 Q800 709 699 672" stroke="#6B645C" stroke-width="4" fill="none" marker-end="url(#ah)"/><path d="M500 588 Q410 544 438 477" stroke="#6B645C" stroke-width="4" fill="none" marker-end="url(#ah)"/><path d="M514 341 Q559 277 677 272" stroke="#6B645C" stroke-width="4" fill="none" marker-end="url(#ah)"/><rect x="630" y="164" width="340" height="112" rx="16" fill="#FFFCF7" stroke="#B4442C" stroke-width="4"/><text x="800.0" y="210.0" fill="#B4442C" font-size="30" text-anchor="middle" font-weight="700" font-style="normal">Intention</text><text x="800.0" y="250.0" fill="#111111" font-size="22" text-anchor="middle" font-weight="400" font-style="normal">what the garment must do</text><rect x="1039" y="337" width="340" height="112" rx="16" fill="#FFFCF7" stroke="#B4442C" stroke-width="4"/><text x="1208.954302006916" y="382.74575140626314" fill="#B4442C" font-size="30" text-anchor="middle" font-weight="700" font-style="normal">Constraints</text><text x="1208.954302006916" y="422.74575140626314" fill="#111111" font-size="22" text-anchor="middle" font-weight="400" font-style="normal">prompt, references, parameters</text><rect x="883" y="616" width="340" height="112" rx="16" fill="#FFFCF7" stroke="#2C5F8A" stroke-width="4"/><text x="1052.7476584857634" y="662.2542485937369" fill="#2C5F8A" font-size="30" text-anchor="middle" font-weight="700" font-style="normal">Proposal</text><text x="1052.7476584857634" y="702.2542485937369" fill="#111111" font-size="22" text-anchor="middle" font-weight="400" font-style="normal">the tool explores its learned space</text><rect x="377" y="616" width="340" height="112" rx="16" fill="#FFFCF7" stroke="#B4442C" stroke-width="4"/><text x="547.2523415142366" y="662.2542485937369" fill="#B4442C" font-size="30" text-anchor="middle" font-weight="700" font-style="normal">Judgement</text><text x="547.2523415142366" y="702.2542485937369" fill="#111111" font-size="22" text-anchor="middle" font-weight="400" font-style="normal">select, reject, say why</text><rect x="221" y="337" width="340" height="112" rx="16" fill="#FFFCF7" stroke="#B4442C" stroke-width="4"/><text x="391.04569799308393" y="382.7457514062632" fill="#B4442C" font-size="30" text-anchor="middle" font-weight="700" font-style="normal">Revision + declaration</text><text x="391.04569799308393" y="422.7457514062632" fill="#111111" font-size="22" text-anchor="middle" font-weight="400" font-style="normal">change, test, credit the process</text><text x="800" y="464" fill="#6B645C" font-size="26" text-anchor="middle" font-weight="700" font-style="normal">Trace kept:</text><text x="800" y="500" fill="#6B645C" font-size="24" text-anchor="middle" font-weight="400" font-style="normal">prompt · seed · rejects · reasons</text><rect x="1230" y="160" width="26" height="26" fill="#B4442C"/><text x="1266" y="182" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">human decision</text><rect x="1230" y="200" width="26" height="26" fill="#2C5F8A"/><text x="1266" y="222" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">machine move</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#111111" stroke-width="1.5"/><text x="64" y="856" fill="#111111" font-size="26" text-anchor="start" font-weight="600" font-style="normal">The tool can explore a space. Judging value, and signing it, stays with the designer.</text></g></svg>
