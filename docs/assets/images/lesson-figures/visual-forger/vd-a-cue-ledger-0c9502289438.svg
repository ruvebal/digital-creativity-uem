<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">What a cue proves and what it cannot</title><desc id="d">Course diagram, a table of seven pictorial depth cues. Occlusion shows which layer is in front but cannot prove how much ease lies underneath. Relative size shows nearer or farther if sizes are known but not the wearer’s real measurements. Linear perspective shows where the camera stood but not whether a seam hangs straight on the body. Texture gradient shows how a surface tilts but not whether the fabric will stretch. Aerial perspective shows that something is far away but says nothing indoors under studio light. Shading and shadow show which way a fold curves but not its weight or drape. Motion parallax shows depth order as the camera moves but not how the garment itself moves. Caption: a cue is evidence about the picture; fit, drape and stretch need another test.</desc><rect width="1600" height="900" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="64" y="86" fill="#111111" font-size="46" text-anchor="start" font-weight="700" font-style="normal">What a cue proves — and what it cannot</text><text x="64" y="132" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="italic">Seven pictorial depth cues read against a fashion question</text><rect x="64" y="176" width="1472" height="62" fill="#111111"/><text x="84" y="218" fill="#FFFCF7" font-size="28" text-anchor="start" font-weight="700" font-style="normal">Cue</text><text x="440" y="218" fill="#FFFCF7" font-size="28" text-anchor="start" font-weight="700" font-style="normal">It can show…</text><text x="980" y="218" fill="#F2C6B8" font-size="28" text-anchor="start" font-weight="700" font-style="normal">It cannot prove…</text><rect x="64" y="238" width="1472" height="78" fill="#FFFCF7"/><text x="84" y="288" fill="#111111" font-size="30" text-anchor="start" font-weight="700" font-style="normal">Occlusion</text><text x="440" y="288" fill="#111111" font-size="28" text-anchor="start" font-weight="400" font-style="normal">which layer is in front</text><text x="980" y="288" fill="#B4442C" font-size="28" text-anchor="start" font-weight="600" font-style="normal">how much ease lies underneath</text><rect x="64" y="316" width="1472" height="78" fill="#EFE6D6"/><text x="84" y="366" fill="#111111" font-size="30" text-anchor="start" font-weight="700" font-style="normal">Relative size</text><text x="440" y="366" fill="#111111" font-size="28" text-anchor="start" font-weight="400" font-style="normal">nearer or farther, if sizes are known</text><text x="980" y="366" fill="#B4442C" font-size="28" text-anchor="start" font-weight="600" font-style="normal">the wearer’s real measurements</text><rect x="64" y="394" width="1472" height="78" fill="#FFFCF7"/><text x="84" y="444" fill="#111111" font-size="30" text-anchor="start" font-weight="700" font-style="normal">Linear perspective</text><text x="440" y="444" fill="#111111" font-size="28" text-anchor="start" font-weight="400" font-style="normal">where the camera stood</text><text x="980" y="444" fill="#B4442C" font-size="28" text-anchor="start" font-weight="600" font-style="normal">whether a seam hangs straight on the body</text><rect x="64" y="472" width="1472" height="78" fill="#EFE6D6"/><text x="84" y="522" fill="#111111" font-size="30" text-anchor="start" font-weight="700" font-style="normal">Texture gradient</text><text x="440" y="522" fill="#111111" font-size="28" text-anchor="start" font-weight="400" font-style="normal">how a surface tilts away</text><text x="980" y="522" fill="#B4442C" font-size="28" text-anchor="start" font-weight="600" font-style="normal">whether the fabric will stretch</text><rect x="64" y="550" width="1472" height="78" fill="#FFFCF7"/><text x="84" y="600" fill="#111111" font-size="30" text-anchor="start" font-weight="700" font-style="normal">Aerial perspective</text><text x="440" y="600" fill="#111111" font-size="28" text-anchor="start" font-weight="400" font-style="normal">that something is far away</text><text x="980" y="600" fill="#B4442C" font-size="28" text-anchor="start" font-weight="600" font-style="normal">anything indoors, under studio light</text><rect x="64" y="628" width="1472" height="78" fill="#EFE6D6"/><text x="84" y="678" fill="#111111" font-size="30" text-anchor="start" font-weight="700" font-style="normal">Shading and shadow</text><text x="440" y="678" fill="#111111" font-size="28" text-anchor="start" font-weight="400" font-style="normal">which way a fold curves</text><text x="980" y="678" fill="#B4442C" font-size="28" text-anchor="start" font-weight="600" font-style="normal">the fold’s weight or drape</text><rect x="64" y="706" width="1472" height="78" fill="#FFFCF7"/><text x="84" y="756" fill="#111111" font-size="30" text-anchor="start" font-weight="700" font-style="normal">Motion parallax</text><text x="440" y="756" fill="#111111" font-size="28" text-anchor="start" font-weight="400" font-style="normal">depth order as the camera moves</text><text x="980" y="756" fill="#B4442C" font-size="28" text-anchor="start" font-weight="600" font-style="normal">how the garment itself moves</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#111111" stroke-width="1.5"/><text x="64" y="856" fill="#111111" font-size="26" text-anchor="start" font-weight="600" font-style="normal">A cue is evidence about the picture. Fit, drape and stretch need another test.</text></g></svg>
