<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A section makes interior form inspectable</title>
  <desc id="desc">A faceted garment-like volume is cut by a translucent plane. The highlighted cross-section shows how a chosen plane produces an interior contour that cannot be read from the outer silhouette alone.</desc>
  <rect width="1600" height="900" fill="#F7F2E8"/>
  <g font-family="Inter, Arial, sans-serif" fill="#111827">
    <text x="72" y="92" font-size="34" font-weight="500">A section makes interior form inspectable</text>
    <text x="72" y="132" font-size="20" fill="#596579">Choose a plane; read the contour where it passes through the volume.</text>
    <path d="M570 235 810 155 1045 245 1000 670 810 770 620 670Z" fill="#E8D8C5" stroke="#24344D" stroke-width="5" stroke-linejoin="round"/>
    <path d="m570 235 240 80 235-70M810 315v455m0-455 190 355m-190-355L620 670" fill="none" stroke="#24344D" stroke-width="3"/>
    <path d="M526 435 858 326 1094 407 762 516Z" fill="#D0E2DC" fill-opacity=".78" stroke="#347B68" stroke-width="4" stroke-linejoin="round"/>
    <path d="M526 435 762 516 1094 407" fill="none" stroke="#B45B43" stroke-width="6" stroke-linecap="round"/>
    <circle cx="762" cy="516" r="12" fill="#B45B43"/>
    <path d="M1095 407h180" stroke="#347B68" stroke-width="3"/>
    <rect x="1275" y="347" width="232" height="126" rx="18" fill="#FFFDF8" stroke="#D7D2C6" stroke-width="2"/>
    <text x="1303" y="391" font-size="18" font-weight="500" fill="#334155">Cut plane</text>
    <text x="1303" y="425" font-size="16" fill="#596579">reveals a section</text>
    <path d="M1275 453 1146 492 762 516" fill="none" stroke="#347B68" stroke-width="2"/>
    <g transform="translate(1130 590)">
      <rect width="310" height="148" rx="18" fill="#FFFDF8" stroke="#D7D2C6" stroke-width="2"/>
      <path d="M45 91c35-49 73-50 110-12 30 30 67 28 110-27" fill="none" stroke="#B45B43" stroke-width="5" stroke-linecap="round"/>
      <text x="155" y="127" text-anchor="middle" font-size="16" fill="#596579">Section contour</text>
    </g>
    <text x="800" y="830" text-anchor="middle" font-size="18" fill="#596579">The outer surface cannot answer every question about volume.</text>
  </g>
</svg>
