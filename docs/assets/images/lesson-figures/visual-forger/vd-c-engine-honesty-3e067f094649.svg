<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">Before you praise the depth, name the engine</title><desc id="d">Course diagram with three columns. 2.5-D layers, painter’s order: flat layers stacked back to front once, drawn as three overlapping cards; its lie, shapes that cross each other cannot both be in front. 3-D depth-tested, Z-buffer: each pixel keeps the nearest surface every frame, drawn as a grid of grey cells with depth numbers; its limit, only as true as the model and its light. AI image, learned plausibility: no scene and no camera, cues imitated from training pictures, drawn as a cloud of red dots; its lie, shadows, seams and supports may disagree. Caption: volume on screen is a claim; say which engine made it, then test the garment.</desc><rect width="1600" height="900" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="64" y="86" fill="#111111" font-size="46" text-anchor="start" font-weight="700" font-style="normal">Before you praise the depth, name the engine</text><text x="64" y="132" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="italic">Three ways a screen can show volume — each promises something different</text><rect x="64" y="176" width="464" height="600" rx="18" fill="#FFFCF7" stroke="#2C5F8A" stroke-width="4"/><text x="96" y="236" fill="#111111" font-size="36" text-anchor="start" font-weight="700" font-style="normal">2.5-D layers</text><text x="96" y="276" fill="#2C5F8A" font-size="28" text-anchor="start" font-weight="600" font-style="italic">Painter’s order</text><rect x="176.0" y="346" width="170" height="110" fill="#EFE6D6" stroke="#111111" stroke-width="2"/><rect x="216.0" y="374" width="170" height="110" fill="#FFFCF7" stroke="#111111" stroke-width="2"/><rect x="256.0" y="402" width="170" height="110" fill="#EFE6D6" stroke="#111111" stroke-width="2"/><text x="96" 