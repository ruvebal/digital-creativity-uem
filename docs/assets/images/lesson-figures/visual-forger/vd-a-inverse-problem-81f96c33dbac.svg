<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">One picture, many worlds</title><desc id="d">Course diagram. An eye on the right looks through a flat picture plane. Two dashed rays leave the eye. Three objects fit exactly between the rays: a small card near the eye, a tilted plank in the middle distance, and a large card far away. All three cast the same short red image on the picture plane, so the picture alone cannot say which world is out there. Caption: the eye must choose one world; that choice is the inverse problem of seeing.</desc><rect width="1600" height="900" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="64" y="86" fill="#111111" font-size="46" text-anchor="start" font-weight="700" font-style="normal">One picture, many worlds</text><text x="64" y="132" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="italic">Every object that fills the same two rays casts the same image on the eye</text><path d="M1360 470 L120 263.3 M1360 470 L120 676.7" stroke="#2C5F8A" stroke-width="3" stroke-dasharray="14 10" fill="none"/><line x1="1120" y1="300" x2="1120" y2="650" stroke="#111111" stroke-width="3"/><line x1="1120" y1="430" x2="1120" y2="510" stroke="#B4442C" stroke-width="12"/><text x="1120" y="690" fill="#111111" font-size="26" text-anchor="middle" font-weight="600" font-style="normal">the flat picture</text><ellipse cx="1388" cy="470" rx="34" ry="22" fill="#FFFCF7" stroke="#111111" stroke-width="3"/><circle cx="1378" cy="470" r="10" fill="#111111"/><text x="1390" y="540" fill="#111111" font-size="26" text-anchor="middle" font-weight="600" font-style="normal">eye</text><rect x="938" y="401.7" width="24" height="136.7" fill="#111111"/><text x="950" y="582.3333333333334" fill="#111111" font-size="26" text-anchor="middle" font-weight="400" font-style="normal">near and small</text><line x1="650" y1="351.7" x2="480" y2="616.7" stroke="#111111" stroke-width="22" stroke-linecap="butt"/><text x="565" y="668.6666666666666" fill="#111111" font-size="26" text-anchor="middle" font-weight="400" font-style="normal">tilted</text><rect x="208" y="280.0" width="24" height="380.0" fill="#111111"/><text x="220" y="704.0" fill="#111111" font-size="26" text-anchor="middle" font-weight="400" font-style="normal">far and large</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#111111" stroke-width="1.5"/><text x="64" y="856" fill="#111111" font-size="26" text-anchor="start" font-weight="600" font-style="normal">The eye must choose one world. That choice is the inverse problem of seeing.</text></g></svg>
