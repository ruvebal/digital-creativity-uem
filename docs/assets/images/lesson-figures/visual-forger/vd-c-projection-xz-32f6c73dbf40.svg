<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">Alberti’s window, written as a ratio</title><desc id="d">Course diagram. A camera on the left looks along a depth axis. A picture plane stands at distance d. The same garment, drawn as a black bar, stands at depth z and again at depth 2z; dashed rays from the camera to the tops of both cross the plane. The red image of the nearer garment has height h; the farther one has height h over 2. Formula box: x prime equals d times x divided by z. Caption: twice as far, half as big; farther things shrink because the image divides by depth.</desc><rect width="1600" height="900" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="64" y="86" fill="#111111" font-size="46" text-anchor="start" font-weight="700" font-style="normal">Alberti’s window, written as a ratio</text><text x="64" y="132" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="italic">The virtual camera of every 3-D program divides by depth</text><line x1="120" y1="600" x2="1520" y2="600" stroke="#111111" stroke-width="2"/><text x="1520" y="640" fill="#6B645C" font-size="26" text-anchor="end" font-weight="400" font-style="normal">depth z</text><line x1="480" y1="250" x2="480" y2="680" stroke="#111111" stroke-width="4"/><text x="480" y="240" fill="#111111" font-size="26" text-anchor="middle" font-weight="700" font-style="normal">picture plane</text><rect x="766" y="340" width="28" height="260" fill="#111111"/><text x="780" y="690" fill="#111111" font-size="26" text-anchor="middle" font-weight="400" font-style="normal">garment at depth z</text><line x1="180" y1="600" x2="780" y2="340" stroke="#2C5F8A" stroke-width="2.5" stroke-dasharray="12 9"/><rect x="1366" y="340" width="28" height="260" fill="#111111"/><text x="1380" y="690" fill="#111111" font-size="26" text-anchor="middle" font-weight="400" font-style="normal">same garment at 2z</text><line x1="180" y1="600" x2="1380" y2="340" stroke="#2C5F8A" stroke-width="2.5" stroke-dasharray="12 9"/><line x1="480" y1="600" x2="480" y2="470" stroke="#B4442C" stroke-width="12"/><line x1="498" y1="600" x2="498" y2="535" stroke="#B4442C" stroke-width="12"/><text x="450" y="560" fill="#B4442C" font-size="30" text-anchor="end" font-weight="700" font-style="normal">h</text><text x="520" y="560" fill="#B4442C" font-size="30" text-anchor="start" font-weight="700" font-style="normal">h/2</text><circle cx="180" cy="600" r="16" fill="#111111"/><text x="180" y="650" fill="#111111" font-size="26" text-anchor="middle" font-weight="700" font-style="normal">camera</text><line x1="180" y1="740" x2="480" y2="740" stroke="#6B645C" stroke-width="2"/><text x="330.0" y="775" fill="#6B645C" font-size="28" text-anchor="middle" font-weight="700" font-style="normal">d</text><rect x="980" y="170" width="520" height="130" rx="16" fill="#FFFCF7" stroke="#111111" stroke-width="2"/><text x="1240" y="252" fill="#B4442C" font-size="54" text-anchor="middle" font-weight="700" font-style="normal">x′ = d · x / z</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#111111" stroke-width="1.5"/><text x="64" y="856" fill="#111111" font-size="26" text-anchor="start" font-weight="600" font-style="normal">Twice as far, half as big. Farther things shrink because the image divides by depth.</text></g></svg>
