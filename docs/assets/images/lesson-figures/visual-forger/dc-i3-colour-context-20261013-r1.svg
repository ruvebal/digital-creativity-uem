<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-labelledby="title desc">
  <title id="title">One colour sample, changing context</title>
  <desc id="desc">The same cobalt sample appears against warm coral and cool teal surroundings. Beneath, a source passes through profile and display or export before reaching a viewer.</desc>
  <style>
    .paper{fill:#F7F2E8}.ink{fill:#111111}.muted{fill:#444441}.line{stroke:#5F5E5A}.sample{fill:#185FA5}.warm{fill:#F5C4B3}.cool{fill:#9FE1CB}
    @media(prefers-color-scheme:dark){.paper{fill:#2C2C2A}.ink{fill:#F7F2E8}.muted{fill:#D3D1C7}.line{stroke:#888780}.sample{fill:#85B7EB}.warm{fill:#712B13}.cool{fill:#085041}}
  </style>
  <rect class="paper" width="680" height="360"/>
  <text class="ink" x="40" y="34" font-family="Arial,sans-serif" font-size="18" font-weight="500">One sample, two readings</text>
  <text class="muted" x="40" y="58" font-family="Arial,sans-serif" font-size="13" font-weight="400">The sampled value stays fixed; its surroundings change.</text>

  <g transform="translate(40 82)">
    <rect class="warm" x="0" y="0" width="276" height="144" rx="4"/>
    <rect class="sample" x="110" y="38" width="56" height="56" rx="3"/>
    <path class="line" d="M26 115h224" fill="none" stroke-width="1" opacity=".45"/>
    <text class="ink" x="16" y="132" font-family="Arial,sans-serif" font-size="13" font-weight="500">Warm surround</text>
    <text class="muted" x="260" y="132" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="400">same cobalt sample</text>
  </g>
  <g transform="translate(364 82)">
    <rect class="cool" x="0" y="0" width="276" height="144" rx="4"/>
    <rect class="sample" x="110" y="38" width="56" height="56" rx="3"/>
    <path class="line" d="M26 115h224" fill="none" stroke-width="1" opacity=".45"/>
    <text class="ink" x="16" y="132" font-family="Arial,sans-serif" font-size="13" font-weight="500">Cool surround</text>
    <text class="muted" x="260" y="132" text-anchor="end" font-family="Arial,sans-serif" font-size="12" font-weight="400">same cobalt sample</text>
  </g>

  <text class="muted" x="340" y="249" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400">Perceived contrast and mood depend on context.</text>
  <g fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round">
    <path d="M128 304h40m-7-6 7 6-7 6M287 304h40m-7-6 7 6-7 6M446 304h40m-7-6 7 6-7 6"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text class="ink" x="84" y="294" font-size="13" font-weight="500">Source</text><text class="muted" x="84" y="326" font-size="11" font-weight="400">sampled value</text>
    <text class="ink" x="243" y="294" font-size="13" font-weight="500">Profile / space</text><text class="muted" x="243" y="326" font-size="11" font-weight="400">conversion choices</text>
    <text class="ink" x="402" y="294" font-size="13" font-weight="500">Display / export</text><text class="muted" x="402" y="326" font-size="11" font-weight="400">device conditions</text>
    <text class="ink" x="560" y="294" font-size="13" font-weight="500">Viewer</text><text class="muted" x="560" y="326" font-size="11" font-weight="400">situated reading</text>
  </g>
</svg>
