<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">Promesa, prueba y riesgo</title><desc id="d">Diagrama del curso: tabla de cuatro tecnologías. Prueba virtual con realidad aumentada: promete menos dudas al comprar online; la prueba la aporta a menudo el proveedor; riesgo, ajuste que no se comprueba; declarar que es una simulación. Modelos generados por IA: prometen rapidez y menos coste; prueba de la propia marca; riesgo para el trabajo de modelos y cuerpos irreales; declarar que la persona no existe. Avatares y moda digital: identidad e inclusión; plataforma y estudios; riesgo, cuerpos convertidos en datos; declarar qué datos se recogen. Mundos de marca en juego: experiencia y comunidad; marca y plataforma; riesgo, jardín cerrado y publicidad; declarar quién posee lo comprado. Pie: una tecnología no es buena o mala; pide una prueba y una declaración.</desc><rect width="1600" height="900" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="64" y="86" fill="#111111" font-size="46" text-anchor="start" font-weight="700" font-style="normal">Promesa · prueba · riesgo</text><text x="64" y="132" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="italic">Ficha para explorar una tecnología emergente en comunicación de moda</text><rect x="64" y="176" width="290" height="58" fill="#111111"/><text x="80" y="214" fill="#FFFCF7" font-size="23" text-anchor="start" font-weight="700" font-style="normal">Tecnología</text><rect x="360" y="176" width="294" height="58" fill="#111111"/><text x="376" y="214" fill="#FFFCF7" font-size="23" text-anchor="start" font-weight="700" font-style="normal">Promete</text><rect x="660" y="176" width="314" height="58" fill="#111111"/><text x="676" y="214" fill="#FFFCF7" font-size="23" text-anchor="start" font-weight="700" font-style="normal">¿Quién aporta la prueba?</text><rect x="980" y="176" width="264" height="58" fill="#111111"/><text x="996" y="214" fill="#FFFCF7" font-size="23" text-anchor="start" font-weight="700" font-style="normal">Riesgo</text><rect x="1250" y="176" width="286" height="58" fill="#111111"/><text x="1266" y="214" fill="#FFFCF7" font-size="23" text-anchor="start" font-weight="700" font-style="normal">Qué declarar</text><rect x="64" y="240" width="290" height="130" fill="#FFFCF7"/><text x="80" y="282" fill="#111111" font-size="25" text-anchor="start" font-weight="700" font-style="normal">Prueba virtual</text><text x="80" y="314" fill="#111111" font-size="25" text-anchor="start" font-weight="700" font-style="normal">(RA)</text><rect x="360" y="240" width="294" height="130" fill="#FFFCF7"/><text x="376" y="282" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">menos dudas al</text><text x="376" y="314" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">comprar online</text><rect x="660" y="240" width="314" height="130" fill="#FFFCF7"/><text x="676" y="282" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">a menudo, el</text><text x="676" y="314" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">proveedor de la</text><text x="676" y="346" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">tecnología</text><rect x="980" y="240" width="264" height="130" fill="#FFFCF7"/><text x="996" y="282" fill="#B4442C" font-size="24" text-anchor="start" font-weight="400" font-style="normal">ajuste que no se</text><text x="996" y="314" fill="#B4442C" font-size="24" text-anchor="start" font-weight="400" font-style="normal">comprueba</text><rect x="1250" y="240" width="286" height="130" fill="#FFFCF7"/><text x="1266" y="282" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">que es una</text><text x="1266" y="314" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">simulación</text><rect x="64" y="376" width="290" height="130" fill="#EFE6D6"/><text x="80" y="418" fill="#111111" font-size="25" text-anchor="start" font-weight="700" font-style="normal">Modelos generados</text><text x="80" y="450" fill="#111111" font-size="25" text-anchor="start" font-weight="700" font-style="normal">por IA</text><rect x="360" y="376" width="294" height="130" fill="#EFE6D6"/><text x="376" y="418" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">rapidez y menos</text><text x="376" y="450" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">coste</text><rect x="660" y="376" width="314" height="130" fill="#EFE6D6"/><text x="676" y="418" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">la propia marca</text><rect x="980" y="376" width="264" height="130" fill="#EFE6D6"/><text x="996" y="418" fill="#B4442C" font-size="24" text-anchor="start" font-weight="400" font-style="normal">trabajo de modelos,</text><text x="996" y="450" fill="#B4442C" font-size="24" text-anchor="start" font-weight="400" font-style="normal">cuerpos irreales</text><rect x="1250" y="376" width="286" height="130" fill="#EFE6D6"/><text x="1266" y="418" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">que la persona no</text><text x="1266" y="450" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">existe</text><rect x="64" y="512" width="290" height="130" fill="#FFFCF7"/><text x="80" y="554" fill="#111111" font-size="25" text-anchor="start" font-weight="700" font-style="normal">Avatares y moda</text><text x="80" y="586" fill="#111111" font-size="25" text-anchor="start" font-weight="700" font-style="normal">digital</text><rect x="360" y="512" width="294" height="130" fill="#FFFCF7"/><text x="376" y="554" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">identidad e</text><text x="376" y="586" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">inclusión</text><rect x="660" y="512" width="314" height="130" fill="#FFFCF7"/><text x="676" y="554" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">plataforma y</text><text x="676" y="586" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">estudios</text><rect x="980" y="512" width="264" height="130" fill="#FFFCF7"/><text x="996" y="554" fill="#B4442C" font-size="24" text-anchor="start" font-weight="400" font-style="normal">cuerpos convertidos</text><text x="996" y="586" fill="#B4442C" font-size="24" text-anchor="start" font-weight="400" font-style="normal">en datos</text><rect x="1250" y="512" width="286" height="130" fill="#FFFCF7"/><text x="1266" y="554" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">qué datos se</text><text x="1266" y="586" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">recogen</text><rect x="64" y="648" width="290" height="130" fill="#EFE6D6"/><text x="80" y="690" fill="#111111" font-size="25" text-anchor="start" font-weight="700" font-style="normal">Mundos de marca</text><text x="80" y="722" fill="#111111" font-size="25" text-anchor="start" font-weight="700" font-style="normal">(juego)</text><rect x="360" y="648" width="294" height="130" fill="#EFE6D6"/><text x="376" y="690" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">experiencia y</text><text x="376" y="722" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">comunidad</text><rect x="660" y="648" width="314" height="130" fill="#EFE6D6"/><text x="676" y="690" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">la marca y la</text><text x="676" y="722" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">plataforma</text><rect x="980" y="648" width="264" height="130" fill="#EFE6D6"/><text x="996" y="690" fill="#B4442C" font-size="24" text-anchor="start" font-weight="400" font-style="normal">jardín cerrado,</text><text x="996" y="722" fill="#B4442C" font-size="24" text-anchor="start" font-weight="400" font-style="normal">publicidad</text><rect x="1250" y="648" width="286" height="130" fill="#EFE6D6"/><text x="1266" y="690" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">quién posee lo</text><text x="1266" y="722" fill="#111111" font-size="24" text-anchor="start" font-weight="400" font-style="normal">comprado</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#111111" stroke-width="1.5"/><text x="64" y="856" fill="#111111" font-size="26" text-anchor="start" font-weight="600" font-style="normal">Una tecnología no es buena o mala: pide una prueba y una declaración.</text></g></svg>
