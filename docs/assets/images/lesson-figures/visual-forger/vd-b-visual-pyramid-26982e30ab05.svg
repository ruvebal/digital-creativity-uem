<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">Alberti’s window: a cut through the visual pyramid</title><desc id="d">Course diagram. On the left, a single still eye, the station point. Dashed blue rays run from the eye to the four corners of a panel on the right holding a black dress silhouette, the scene. Halfway, a framed picture plane, the window, cuts the rays; the red points and a smaller red dress silhouette show the image, where the rays cross the window. Caption: two bold abstractions, a single unmoving eye and a flat cut through the cone of sight.</desc><rect width="1600" height="900" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="64" y="86" fill="#111111" font-size="46" text-anchor="start" font-weight="700" font-style="normal">Alberti’s window: a cut through the visual pyramid</text><text x="64" y="132" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="italic">Florence, 1435: the picture is where the rays from one eye cross a flat plane</text><polygon points="1250,250 1470,300 1470,660 1250,700" fill="#EFE6D6" stroke="#111111" stroke-width="2"/><path d="M1335,320 L1385,320 L1395,380 L1375,430 L1440,640 L1280,640 L1345,430 L1325,380 Z" fill="#111111"/><line x1="170" y1="480" x2="1250" y2="250" stroke="#2C5F8A" stroke-width="2.5" stroke-dasharray="12 9"/><line x1="170" y1="480" x2="1470" y2="300" stroke="#2C5F8A" stroke-width="2.5" stroke-dasharray="12 9"/><line x1="170" y1="480" x2="1470" y2="660" stroke="#2C5F8A" stroke-width="2.5" stroke-dasharray="12 9"/><line x1="170" y1="480" x2="1250" y2="700" stroke="#2C5F8A" stroke-width="2.5" stroke-dasharray="12 9"/><polygon points="700,290 960,330 960,650 700,690" fill="#FFFCF7" fill-opacity="0.82" stroke="#111111" stroke-width="4"/><polygon points="764.0,353.5 885.0,381.0 885.0,579.0 764.0,601.0" fill="none" stroke="#B4442C" stroke-width="3"/><g transform="translate(76.5 216.0) scale(0.55)"><path d="M1335,320 L1385,320 L1395,380 L1375,430 L1440,640 L1280,640 L1345,430 L1325,380 Z" fill="#B4442C"/></g><circle cx="764.0" cy="353.5" r="7" fill="#B4442C"/><circle cx="885.0" cy="381.0" r="7" fill="#B4442C"/><circle cx="885.0" cy="579.0" r="7" fill="#B4442C"/><circle cx="764.0" cy="601.0" r="7" fill="#B4442C"/><circle cx="170" cy="480" r="16" fill="#111111"/><text x="170" y="540" fill="#111111" font-size="28" text-anchor="middle" font-weight="700" font-style="normal">one still eye</text><text x="170" y="574" fill="#6B645C" font-size="24" text-anchor="middle" font-weight="400" font-style="normal">(station point)</text><text x="830" y="272" fill="#111111" font-size="28" text-anchor="middle" font-weight="700" font-style="normal">picture plane = window</text><text x="830" y="736" fill="#B4442C" font-size="26" text-anchor="middle" font-weight="600" font-style="normal">image: where the rays cut the window</text><text x="1360" y="232" fill="#111111" font-size="28" text-anchor="middle" font-weight="700" font-style="normal">the scene</text><text x="430" y="560" fill="#2C5F8A" font-size="26" text-anchor="middle" font-weight="600" font-style="normal">visual rays</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#111111" stroke-width="1.5"/><text x="64" y="856" fill="#111111" font-size="26" text-anchor="start" font-weight="600" font-style="normal">Two bold abstractions: a single, unmoving eye and a flat cut through the cone of sight.</text></g></svg>
