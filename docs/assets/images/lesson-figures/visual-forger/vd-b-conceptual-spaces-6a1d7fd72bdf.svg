<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">Three kinds of creative move</title><desc id="d">Course diagram after Margaret Boden, three panels. Combinational: join two ideas that rarely meet; drawn as two separate fields linked by a red arc; example, Edo Japanese prints of the 1700s adopt Western perspective, called uki-e; fashion example, a tailoring code with a sportswear fabric. Exploratory: travel further inside shared rules; drawn as a path wandering inside one field; example, Florentine painters of the 1300s testing boxes of space; fashion example, every skirt shape a pannier allows. Transformational: change a rule so new things become thinkable; drawn as a dashed old boundary replaced by a larger red shape; example, Florence 1420s to 1435, one vanishing point measured on a plane; fashion example, Rei Kawakubo in 1997, a padded bump that redefines the silhouette. Caption: creativity means ideas that are new, surprising and valuable; which move is your image making?</desc><rect width="1600" height="900" fill="#F7F2E8"/><g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="64" y="86" fill="#111111" font-size="46" text-anchor="start" font-weight="700" font-style="normal">Three kinds of creative move</text><text x="64" y="132" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="italic">Margaret Boden’s map, read through the history of pictorial space</text><rect x="64" y="176" width="464" height="600" rx="18" fill="#FFFCF7" stroke="#111111" stroke-width="2"/><text x="96" y="236" fill="#111111" font-size="38" text-anchor="start" font-weight="700" font-style="normal">Combinational</text><rect x="116.0" y="276" width="150" height="140" rx="20" fill="#EFE6D6" stroke="#111111"/><rect x="326.0" y="276" width="150" height="140" rx="20" fill="#EFE6D6" stroke="#111111"/><circle cx="191.0" cy="346" r="14" fill="#2C5F8A"/><circle cx="401.0" cy="346" r="14" fill="#2C5F8A"/><path d="M191.0 346 Q296.0 226 401.0 346" stroke="#B4442C" stroke-width="5" fill="none"/><text x="96" y="476" fill="#111111" font-size="29" text-anchor="start" font-weight="600" font-style="normal">Join two ideas that rarely</text><text x="96" y="516" fill="#111111" font-size="29" text-anchor="start" font-weight="600" font-style="normal">meet.</text><text x="96" y="572" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="normal">Edo, 1700s: Japanese prints</text><text x="96" y="608" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="normal">adopt Western perspective —</text><text x="96" y="644" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="normal">uki-e.</text><text x="96" y="696" fill="#2C5F8A" font-size="26" text-anchor="start" font-weight="400" font-style="italic">A tailoring code + a</text><text x="96" y="732" fill="#2C5F8A" font-size="26" text-anchor="start" font-weight="400" font-style="italic">sportswear fabric.</text><rect x="560" y="176" width="464" height="600" rx="18" fill="#FFFCF7" stroke="#111111" stroke-width="2"/><text x="592" y="236" fill="#111111" font-size="38" text-anchor="start" font-weight="700" font-style="normal">Exploratory</text><rect x="622.0" y="266" width="340" height="160" rx="30" fill="#EFE6D6" stroke="#111111"/><path d="M652.0 386 C702.0 286 752.0 406 792.0 336 S882.0 286 932.0 376" stroke="#2C5F8A" stroke-width="5" fill="none"/><circle cx="932.0" cy="376" r="12" fill="#2C5F8A"/><text x="592" y="476" fill="#111111" font-size="29" text-anchor="start" font-weight="600" font-style="normal">Travel further inside the</text><text x="592" y="516" fill="#111111" font-size="29" text-anchor="start" font-weight="600" font-style="normal">rules you share.</text><text x="592" y="572" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="normal">Florence, 1300s: painters test</text><text x="592" y="608" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="normal">boxes of space, step by step.</text><text x="592" y="660" fill="#2C5F8A" font-size="26" text-anchor="start" font-weight="400" font-style="italic">Every skirt shape a pannier</text><text x="592" y="696" fill="#2C5F8A" font-size="26" text-anchor="start" font-weight="400" font-style="italic">allows.</text><rect x="1056" y="176" width="464" height="600" rx="18" fill="#FFFCF7" stroke="#111111" stroke-width="2"/><text x="1088" y="236" fill="#B4442C" font-size="38" text-anchor="start" font-weight="700" font-style="normal">Transformational</text><rect x="1168.0" y="286" width="240" height="120" rx="24" fill="none" stroke="#6B645C" stroke-width="3" stroke-dasharray="10 8"/><path d="M1098.0 316 Q1228.0 236 1348.0 276 T1478.0 356 Q1408.0 436 1288.0 426 T1098.0 316 Z" fill="#B4442C" fill-opacity="0.18" stroke="#B4442C" stroke-width="4"/><circle cx="1453.0" cy="356" r="12" fill="#B4442C"/><text x="1088" y="476" fill="#111111" font-size="29" text-anchor="start" font-weight="600" font-style="normal">Change a rule, so new things</text><text x="1088" y="516" fill="#111111" font-size="29" text-anchor="start" font-weight="600" font-style="normal">become thinkable.</text><text x="1088" y="572" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="normal">Florence, 1420s–1435: one</text><text x="1088" y="608" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="normal">vanishing point, measured on a</text><text x="1088" y="644" fill="#6B645C" font-size="26" text-anchor="start" font-weight="400" font-style="normal">plane.</text><text x="1088" y="696" fill="#2C5F8A" font-size="26" text-anchor="start" font-weight="400" font-style="italic">Kawakubo, 1997: a padded bump</text><text x="1088" y="732" fill="#2C5F8A" font-size="26" text-anchor="start" font-weight="400" font-style="italic">redefines the silhouette.</text><line x1="64" y1="812" x2="1536" y2="812" stroke="#111111" stroke-width="1.5"/><text x="64" y="856" fill="#111111" font-size="26" text-anchor="start" font-weight="600" font-style="normal">Creativity: ideas that are new, surprising and valuable. Which move is your image making?</text></g></svg>
