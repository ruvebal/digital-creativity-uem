<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Digital fashion image regimes</title>
  <desc id="desc">A semantic graph connecting practice, venue, audience, circulation, and the changing boundary between art and commerce.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18141D"/><stop offset="1" stop-color="#070A11"/></linearGradient></defs>
  <rect width="1600" height="620" rx="34" fill="url(#bg)"/>
  <g fill="none" stroke="#9BE2D1" stroke-width="4" stroke-opacity=".55"><path d="M330 310 C500 170 575 170 760 310"/><path d="M760 310 C940 170 1015 170 1270 230"/><path d="M760 310 C940 450 1015 450 1270 390"/><path d="M330 310 C500 450 575 450 760 310"/></g>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle"><g transform="translate(330 310)"><circle r="126" fill="#E8C56C" fill-opacity=".2" stroke="#E8C56C" stroke-width="4"/><text y="-18" fill="#FFF7EC" font-size="28" font-weight="700">PRACTICE</text><text y="24" fill="#FFF7EC" font-size="20">who makes it?</text></g><g transform="translate(760 310)"><circle r="142" fill="#F07C63" fill-opacity=".2" stroke="#F07C63" stroke-width="4"/><text y="-18" fill="#FFF7EC" font-size="28" font-weight="700">IMAGE</text><text y="24" fill="#FFF7EC" font-size="20">what is made visible?</text></g><g transform="translate(1270 230)"><circle r="112" fill="#9BE2D1" fill-opacity=".2" stroke="#9BE2D1" stroke-width="4"/><text y="-18" fill="#FFF7EC" font-size="26" font-weight="700">VENUE</text><text y="22" fill="#FFF7EC" font-size="19">where does it act?</text></g><g transform="translate(1270 390)"><circle r="112" fill="#9BE2D1" fill-opacity=".2" stroke="#9BE2D1" stroke-width="4"/><text y="-18" fill="#FFF7EC" font-size="26" font-weight="700">AUDIENCE</text><text y="22" fill="#FFF7EC" font-size="19">who reads it?</text></g><text x="800" y="570" fill="#E8C56C" font-size="24">circulation changes the art / commerce boundary</text></g>
</svg>
