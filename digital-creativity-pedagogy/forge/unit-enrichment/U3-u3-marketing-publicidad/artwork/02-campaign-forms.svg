<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
<title id="title">Cinco formas de comunicar y pedir evidencia</title>
<desc id="desc">Cinco ilustraciones tipográficas conectan los casos ya asignados a U3 con una pregunta de lectura: marca e imagen, vestuario y representación, carnaval y protesta, voz de trabajadoras, y encuadre y regulación.</desc>
<rect width="1440" height="840" fill="#F7F2E8"/>
<text x="72" y="68" font-family="Arial,sans-serif" font-size="18" letter-spacing="3" fill="#446B58">U3 · CINCO CASOS, CINCO PRUEBAS</text>
<text x="72" y="128" font-family="Georgia,serif" font-size="46" fill="#152522">La campaña también es una forma de encuadrar.</text>
