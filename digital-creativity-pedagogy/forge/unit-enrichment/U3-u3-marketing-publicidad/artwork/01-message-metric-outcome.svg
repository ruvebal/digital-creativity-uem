<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="580" viewBox="0 0 1440 580" role="img" aria-labelledby="title desc">
<title id="title">De la imagen a la evidencia</title>
<desc id="desc">Una campaña formula un mensaje. Tres observaciones posibles —atención, participación y divulgación— aparecen como rutas separadas. A un lado, los cambios fuera de pantalla requieren evidencia propia.</desc>
<rect width="1440" height="580" fill="#F7F2E8"/>
<path d="M72 83H1368" stroke="#152522" stroke-opacity=".16"/>
<text x="80" y="62" font-family="Arial,sans-serif" font-size="18" letter-spacing="3" fill="#446B58">LECTURA DE CAMPAÑA · MAPA DE EVIDENCIA</text>
<text x="80" y="138" font-family="Georgia,serif" font-size="48" fill="#152522">Lo que una campaña muestra no mide todo lo que cambia.</text>
<g transform="translate(110 230)">
<path d="M20 83 86 20l102 0 65 63-65 63H86Z" fill="#152522"/>
<path d="M86 20 122 83 86 146M188 20l-34 63 34 63" fill="none" stroke="#F7F2E8" stroke-opacity=".58" stroke-width="2"/>
<circle cx="122" cy="83" r="13" fill="#D96E51"/>
<text x="-4" y="199" font-family="Arial,sans-serif" font-size="18" fill="#152522">MENSAJE / IMAGEN</text>
<text x="-4" y="229" font-family="Arial,sans-serif" font-size="15" fill="#5C625B">¿Qué propone?</text>
</g>
<path d="M385 313H505" stroke="#446B58" stroke-width="2" stroke-dasharray="5 9"/>
<circle cx="505" cy="313" r="6" fill="#446B58"/>
<g font-family="Arial,sans-serif" fill="#152522">
<g transform="translate(530 224)"><circle cx="75" cy="75" r="62" fill="none" stroke="#D96E51" stroke-width="2"/><circle cx="75" cy="75" r="43" fill="#F1E6D4"/><text x="75" y="72" text-anchor="middle" font-size="20">Atención</text><text x="75" y="101" text-anchor="middle" font-size="14" fill="#5C625B">alcance</text></g>
<g transform="translate(700 224)"><circle cx="75" cy="75" r="62" fill="none" stroke="#446B58" stroke-width="2"/><circle cx="75" cy="75" r="43" fill="#E5EBDD"/><text x="75" y="72" text-anchor="middle" font-size="20">Acción</text><text x="75" y="101" text-anchor="middle" font-size="14" fill="#5C625B">participación</text></g>
<g transform="translate(870 224)"><circle cx="75" cy="75" r="62" fill="none" stroke="#D9A84A" stroke-width="2"/><circle cx="75" cy="75" r="43" fill="#F3EBD8"/><text x="75" y="72" text-anchor="middle" font-size="20">Divulgación</text><text x="75" y="101" text-anchor="middle" font-size="14" fill="#5C625B">qué se comparte</text></g>
</g>
<text x="547" y="412" font-family="Arial,sans-serif" font-size="17" fill="#5C625B">Indicadores distintos · ninguno prueba por sí solo un cambio social.</text>
<path d="M1072 193V449" stroke="#152522" stroke-opacity=".2"/>
<g transform="translate(1110 236)">
<path d="M58 0 115 33v66l-57 33L1 99V33Z" fill="#446B58"/>
<path d="m58 0 0 132M1 33l114 66M115 33 1 99" stroke="#F7F2E8" stroke-opacity=".8" stroke-width="2"/>
<circle cx="58" cy="66" r="7" fill="#F7F2E8"/>
<text x="-4" y="174" font-family="Arial,sans-serif" font-size="20" fill="#152522">Efectos</text>
<text x="-4" y="201" font-family="Arial,sans-serif" font-size="15" fill="#5C625B">piden otra prueba</text>
</g>
<text x="80" y="530" font-family="Arial,sans-serif" font-size="15" fill="#5C625B">La figura ordena preguntas; no presenta resultados de una campaña concreta.</text>
</svg>
