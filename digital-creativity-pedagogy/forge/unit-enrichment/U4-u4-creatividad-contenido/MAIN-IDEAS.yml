ideas:
  - id: 1
    heading: La creatividad empieza con una tensión
    sentence: "Una idea creativa no es una ocurrencia aislada: responde a una tensión concreta y decide qué puede sostener."
    case: "Caso: The Or Foundation / Kantamanto / Stop Waste Colonialism (rank 10)."
    case_track: C
    case_rank: 10
    case_url: "https://youtu.be/bwhWP6gEN6w?si=FzL95n3a4dxiLaIW"
    stance: studio_hypothesis
    evidence_boundary: "El caso aporta contexto para diseñar un relato; no prueba el impacto de la propuesta estudiantil."
  - id: 2
    heading: La imagen de moda construye una mirada
    sentence: "Antes de publicar una imagen, pregunta qué práctica activa, quién aparece, quién habla y qué queda fuera del encuadre."
    quote: "Fashion photography comprises a wide array of practices"
    quote_origin: ahmes
    chicago: "(Shinkle 2008, 15)"
    source_node: cca1472b-b0c6-594c-8e13-ed87d6b73897
    media_role: "archive image plus captioned course diagram"
  - id: 3
    heading: El relato se diseña como secuencia
    sentence: "Ordena apertura, desarrollo y cierre antes de pedir una reacción: el formato cambia qué puede comprender y hacer la audiencia."
    stance: studio_hypothesis
    media_role: "course-generated sequence diagram"
  - id: 4
    heading: Participar no es solo reaccionar
    sentence: "Un comentario, un guardado y una acción material son señales distintas: no las conviertas en una sola métrica de éxito."
    stance: studio_hypothesis
    case: "Caso: Kantamanto como prueba de contexto, voces y circulación; no como cifra universal."
    case_url: "https://youtu.be/bwhWP6gEN6w?si=FzL95n3a4dxiLaIW"
  - id: 5
    heading: La creatividad también responde de sus pruebas
    sentence: "Separa afirmación, recurso visual y evidencia; atribuye lo abierto y declara qué resultado todavía no puedes demostrar."
    stance: studio_hypothesis
    media_role: "claim-evidence boundary diagram"

