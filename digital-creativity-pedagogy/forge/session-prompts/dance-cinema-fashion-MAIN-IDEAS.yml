# Instructor research spine; not a public citation or an approved session plan.
series: dance-cinema-fashion
course: CD I
primary_unit_id: I.7
conditional_secondary_unit_id: I.8
max_masterclass_ideas: 6
forged: 2026-10-27
status: run2_taught_pilot_2026-10-28 (S1–S15 Ahmes extraction and live PDF check still pending)
ideas:
  - id: 1
    title: The moving, dressed body
    student_sentence: A garment changes what a moving body can show and do.
    claim: 'The Met distinguishes an ancient wool peplos from Raymond Duncan’s modern ensemble; its fabrics and pattern reflect later artistic tastes (S1). Movement effects are a teaching interpretation, not evidence of a continuous lineage.'
    cases: [ancient peplos, Raymond Duncan, Isadora Duncan]
    sources: [S1, S2]
    visual_requirement: 'Accessible course diagram comparing drape and forces; approved historic images only after review.'
    critical_tension: 'Which classical body becomes a universal ideal, and whose histories are excluded?'
    open_question: 'What evidence distinguishes a modern revival from an ancient practice?'
  - id: 2
    title: Costume makes a choreography
    student_sentence: Some costumes amplify movement; others reorganize or restrict it.
    claim: 'Getty records Schlemmer’s 1922 premiere and costume-based abstraction; FIT describes Graham’s Lamentation fabric taking shape through movement (S3, S4). The comparison of affordances is an interpretation.'
    cases: [Loïe Fuller, Isadora Duncan, Oskar Schlemmer, Martha Graham]
    sources: [S2, S3, S4, S5]
    visual_requirement: 'Compare an accepted Schlemmer reconstruction with an accepted Graham image, or use labelled course diagrams.'
    critical_tension: 'Who makes the garment, controls the range of motion and gets authorship credit?'
    open_question: 'When does a constraint become part of a movement vocabulary?'
  - id: 3
    title: Cinema frames the moving body
    student_sentence: A camera and an edit change how we see dance and clothes.
    claim: 'The LIFE gallery identifies Astaire with Rogers in Carefree and Hayworth in You Never Were Lovelier (S6); its photographs are evidence of circulation, not permission to reuse. Frame and editing effects are questions for close analysis of a verified film sequence.'
    cases: [Fred Astaire, Ginger Rogers, Rita Hayworth, dance musicals]
    sources: [S6, S7]
    visual_requirement: 'Course-generated frame and viewpoint diagram; no LIFE image or iframe.'
    critical_tension: 'How do framing, performer labor, stardom and the credited photographer distribute attention?'
    open_question: 'What does a chosen shot reveal or conceal about the dancers and costume?'
  - id: 4
    title: Movement travels with context
    student_sentence: A reference can travel, but its history does not travel automatically.
    claim: 'Aschieri documents an Argentine butoh reception and research on cultural reworking (S8); this is one situated history, not evidence that any fashion design borrowed from it.'
    cases: [Argentine butoh reception, stage and fashion imagery, documented dance-fashion exchange]
    sources: [S8, S9]
    visual_requirement: 'Course diagram of a documented route, with evidence on each arrow; no speculative lineage.'
    critical_tension: 'Who is named, paid or displaced when practices move into a new market?'
    open_question: 'What record would distinguish influence, exchange, appropriation and visual analogy?'
  - id: 5
    title: Who is made strange?
    student_sentence: Ask who is called strange, by whom, and what follows.
    claim: 'Tyler criticizes reproducing disgust toward maternal bodies and asks for a social and political account (S10). Applying that critique to any named collection is an open interpretation requiring evidence.'
    cases: [David Delfín, Ana Locking, Matières Fécales]
    sources: [S10, S11, S12, S13]
    visual_requirement: 'Only accepted contextualized collection media, otherwise a text-and-diagram comparison.'
    critical_tension: 'Provocation can contest a norm or turn excluded bodies into spectacle; labor and commercial reception matter.'
    open_question: 'Whose account and what reception evidence could test a claim of critique rather than shock?'
  - id: 6
    title: Butoh has histories, not one look
    student_sentence: A pose alone cannot tell us where a movement came from.
    claim: 'Baird describes Hijikata’s practice and the divergence and international expansion of butoh; Aschieri studies a specific Argentine reworking (S14, S8). Neither proves a particular fashion influence.'
    cases: [Tatsumi Hijikata, Kazuo Ohno, Argentina reception]
    sources: [S8, S14, S15]
    visual_requirement: 'Accessible timeline and annotated map generated by course; add accepted performance media only with verified context.'
    critical_tension: 'Who can name a tradition, who earns from its circulation, and when does exoticization erase context?'
    open_question: 'Which testimony or archive establishes a specific reception rather than an analogy?'
