    title: No hay una sola fotografía de moda
    student_sentence: Editorial, publicidad, belleza, documental… no uses un solo método para todas.
    slide_quote: "there is no single and easily described genre of 'fashion photography'. Equally, there is no single methodology which is best suited to its analysis"
