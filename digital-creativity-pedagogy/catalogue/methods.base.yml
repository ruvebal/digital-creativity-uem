  summary: Explicit first/second/third read for fashion images.
- id: iconic-vs-graphic-code
  name: Iconic vs graphic code split
  family: composition
  craft_mode: critical
  primary_source: gap
  source_status: held
  gap_work: Torri, Rodriguez Schon & Celi 2025 moodboard guideline (manifest gap keys nearby; not
    Wave-1 verified)
  held_note: Profield composition run marks iconic/graphic split as emerging HE teaching aid.
  profield_runs:
  - dc-fashion-composition-references-pedagogy
  didactics: []
  sandra_acts: []
  steps_basis: classroom adaptation in course wording; not quoted from, and not a claim that the source
    prescribes this sequence
  steps:
  - On a moodboard/key visual, label iconic meaning (what it depicts) vs graphic code (layout, type,
    format).
  - Change only the graphic code once; keep iconic tiles fixed.
  - State what the graphic change argued.
  - Cite source tiles with creator/date/URL where known.
  time_min: 30
  group_size: individual
  materials:
  - laptop or tablet
  - drawing/photo app
  - timer
  units:
  - I.7
  evidence: held — Torri et al. 2025 not in references.yml
  accessibility: Keyboard and typed alternatives accepted where mark-making is required.
  summary: Separate depicted meaning from layout code on boards.
- id: non-destructive-layer-discipline
  name: Non-destructive layer discipline
  family: bitmap
  craft_mode: workflow
  primary_source: gap
  source_status: held
  gap_work: FIT photographic post-production learning objectives / Adobe [PLATFORM] — Profield retouch
    map
  held_note: 'Profield retouch run: non-destructive editing is HE learning objective language, not
    a page-verified sequence here.'
  profield_runs:
  - dc-fashion-retouch-pedagogy
  - dc-2d-image-craft-pedagogy
  didactics: []
  sandra_acts: []
  steps_basis: classroom adaptation in course wording; not quoted from, and not a claim that the source
    prescribes this sequence
  steps:
  - Forbid flattening until export; keep source layers named.
  - Use adjustment layers / masks for every tonal move.
  - Demonstrate undo of one local edit without affecting global grade.
  - Hand in layered file + flat proof.
  time_min: 25
  group_size: individual
  materials:
  - laptop or tablet
  - drawing/photo app
  - timer
  units:
  - I.3
  - I.4
  - II.1
  evidence: held
  accessibility: Keyboard and typed alternatives accepted where mark-making is required.
  summary: Reversible layer workflow before any retouch claim.
