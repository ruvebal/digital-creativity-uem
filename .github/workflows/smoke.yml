name: Smoke Tests

on:
 push:
  branches: [main]
 pull_request:
  branches: [main]

jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: ruby/setup-ruby@v1
     with:
      ruby-version: '3.2'
      bundler-cache: true
   - uses: actions/setup-node@v4
     with:
      node-version: '20'
   - uses: pnpm/action-setup@v4
     with:
      version: 9
   - run: |
      pnpm install --frozen-lockfile
      bundle config set path 'vendor/bundle'
      bundle install --jobs 4 --retry 3
      npm run build
      test ! -d _site/digital-creativity-pedagogy
      test ! -d _site/_research

 student-template:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - name: Check student template scaffold
     working-directory: student-project-template
     run: |
      test -f README.md
